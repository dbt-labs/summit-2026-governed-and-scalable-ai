    implementation:
      cte_shape: [brew_events, potion_supply_cost, final]
      joins: required
      transformations:
        - "Left join potion standard cost to each brew on potion_sku to preserve every brew."
        - "estimated_batch_supply_cost_copper = batch_size * standard_supply_cost_copper."
        - "estimated_batch_supply_cost_gold = copper_to_gold(batch_size * standard_supply_cost_copper)."
        - "Do not adjust cost for quality outcome and do not impute brew duration."
      join_contracts:
        - left_input: stg_alembic_ops__brew_events
          right_input: int_potion_supply_cost
          condition: "brew_events.potion_sku = potion_supply_cost.potion_sku"
          cardinality: many-to-one
          join_type: left
          record_retention: "Retain all brew events, including failed quality checks and null durations; require every current brew to match one potion cost."
          fanout_control: "int_potion_supply_cost.potion_sku is unique; output brew count and distinct brew_id must equal staging brews."
    output_columns:
      - {name: brew_id, logical_type: varchar, source: "stg_alembic_ops__brew_events.brew_id"}
      - {name: potion_sku, logical_type: varchar, source: "stg_alembic_ops__brew_events.potion_sku"}
