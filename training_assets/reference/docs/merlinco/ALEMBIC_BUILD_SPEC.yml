version: 2

plan:
  name: alembic_procurement_wizard_build
  status: approved
  owner: analytics_engineering
  approval:
    approved_by: authorized_human
    evidence: "Explicit selection of 'Approve the complete spec' in the planning conversation on 2026-09-01 after all v2 pre-approval checks passed."
  pre_approval_validation:
    status: passed
    checked_at: "2026-09-01T20:20:00Z"
    checked_by: dbt_assistant
    checks:
      source_and_ref_columns_resolve: passed
      output_origins_match_transformations: passed
      tests_match_post_transformation_data: passed
      properties_and_contracts_match_outputs: passed
      lineage_grain_and_joins_are_coherent: passed
      formulas_and_acceptance_checks_reconcile: passed
      build_selector_covers_planned_models: passed
    findings:
      - "All declared source tables, source columns, existing refs, planned upstream outputs, keys, relationship targets, and test fields resolve; warehouse relationship checks found zero unmatched recipe potions, brew potions, brew shops, ingredients, or suppliers."
      - "Every ordered output has exactly one source or derived_from origin; casts, normalization, macros, aggregation, arithmetic, and mart date derivation are declared as derivations and agree with descriptions."
      - "Post-transformation profiles support the exact accepted-value domains and required-field tests; 200000 null brew durations are deliberately preserved and excluded from not_null tests."
      - "dim_suppliers has five ordered outputs and fct_brews has fourteen; each mart properties list matches its SQL interface and contract data types exactly, including integer copper and number(38, 2) gold."
      - "The eight models are unique and topologically ordered; staging preserves source grains, recipe cost aggregates to potion grain, brew enrichment is many-to-one with left-side retention and no fanout, and marts use one approved input."
      - "Warehouse controls reconcile 406 recipe components to 120 potion standards and 20000000 brews; approved standard and batch formulas reproduce the recorded cost ranges and copper totals."
      - "Selector '+fct_brews +dim_suppliers' reaches all four staging, both intermediate, and both mart models through declared inputs; exact planned model count is eight."
      - "D001-D005 are explicitly approved; Semantic Layer work, actual cost, margin, and production-to-sales allocation remain outside this build."
    unresolved: []
  target:
    track: wizard
    root_path: models/wizard/

request:
  business_outcome: >
    Publish governed supplier and brew-batch products that expose supplier context,
    standardized recipe supply cost per potion, and estimated standard supply cost
    per brew batch without changing source brew grain.
  requested_products:
    - dim_suppliers
    - fct_brews
  intended_consumers:
    - procurement analysts
    - production operations analysts
    - governed BI and AI-assisted analysis through contracted marts
  out_of_scope:
    - actual purchase-order or invoice cost
    - labor, cauldron, overhead, waste, and failed-batch accounting adjustments
    - margin or profitability
    - production-to-sales allocation
    - changes to completed starter models
    - semantic metrics unless separately approved in D005

authority:
  project_conventions:
    - path: AGENTS.md
      established: "Wizard staging views, ephemeral intermediates, contracted table marts, canonical names, explicit final interfaces, and copper plus number(38, 2) gold fields."
    - path: docs/merlinco/STYLE_GUIDE.md
      established: "Staging owns one-source cleanup; intermediate owns joins and grain changes; marts are simple public products with contracts and grounded tests."
    - path: dbt_project.yml
      established: "Configured model root is models/; Wizard layer materializations are view, ephemeral, and table under staging and marts schemas."
    - path: SECURITY.md
      established: "Authorized humans own business meaning, public interfaces, and approval; warehouse evidence is internal and summarized without raw extracts."
    - path: .agents/ROUTING.md
      established: "Planning produces this sole project-owned build spec and does not implement models."
  source_structure:
    - path: models/staging/alembic_ops/_alembic_ops__sources.yml
      established: "Declares raw_suppliers, raw_ingredients, raw_potion_ingredients, and raw_brew_events under source('alembic_ops', ...)."
    - path: docs/merlinco/ERD.md
      established: "Supplier and ingredient keys are singular; recipe grain is (potion_sku, ingredient_id); brew grain is brew_id; declared FKs are intact."
    - path: docs/merlinco/DATA_DICTIONARY.md
      established: "Documents columns, logical types, mixed-case units and quality, messy hazardous booleans, copper costs, and nullable brew duration."
  target_requirements:
    - path: docs/merlinco/LAB_procurement_slice.md
      established: "Requires four staging models, two intermediates, dim_suppliers, fct_brews, canonical lineage, contracts, tests, lint, and warehouse-backed checks."
  implementation_patterns:
    - path: models/staging/abra_pos/stg_abra_pos__potions.sql
      established: "Uses lower(trim()), to_boolean(), integer casts, and copper_to_gold() in one-source staging."
    - path: models/staging/abra_pos/_stg_abra_pos.yml
      established: "Grounds PK, FK, normalized categorical, and required-measure tests in staging outputs."
    - path: models/intermediate/int_orders_with_payments.sql
      established: "Aggregates before joining to preserve target grain and records retention behavior in readable CTEs."
    - path: models/intermediate/int_order_items_with_order_context.sql
      established: "Uses import CTEs and an explicit final CTE for grain-preserving enrichment."
    - path: models/marts/dim_shops.sql
      established: "A dimension is a simple one-input contracted cast from its approved upstream model."
    - path: models/marts/fct_order_items.sql
      established: "A fact casts every public field explicitly and derives a date from its event timestamp."
    - path: models/marts/_marts.yml
      established: "Contracts enumerate every public column and use modern data_tests syntax with arguments."
  semantic_definitions:
    - path: models/marts/_marts.yml
      established: "Existing governed semantics cover sales facts and do not define procurement or production supply-cost metrics."
    - path: models/marts/metrics.yml
      established: "The only standalone ratio metric is average_order_value; no Alembic metric exists."
    - path: models/marts/_semantic_models.yml
      established: "Contains no additional procurement semantic definition."

evidence:
  sources:
    - relation: source('alembic_ops', 'raw_suppliers')
      established:
        grain: one row per supplier
        primary_key: [supplier_id]
        important_findings:
          - "15 rows; supplier_id has zero nulls and zero duplicates."
          - "reliability_rating is non-null and observed from 1 through 5."
          - "supplier_name and contracted_since are non-null."
    - relation: source('alembic_ops', 'raw_ingredients')
      established:
        grain: one row per ingredient
        primary_key: [ingredient_id]
        important_findings:
          - "80 rows; ingredient_id has zero nulls and zero duplicates."
          - "All supplier_id values match suppliers with no fanout."
          - "lower(trim(unit)) yields exactly bundle, dram, gram, pinch, sprig, vial."
          - "All hazardous encodings map to a non-null boolean through to_boolean()."
          - "unit_cost_copper is non-null; observed range is 4 through 219 copper."
          - "harvest_season is non-null and preserves Autumn, Spring, Summer, Winter, Year-round."
    - relation: source('alembic_ops', 'raw_potion_ingredients')
      established:
        grain: one row per potion SKU and ingredient pair
        primary_key: [potion_sku, ingredient_id]
        important_findings:
          - "406 rows; composite key fields have zero nulls and zero duplicates."
          - "All ingredient_id values match ingredients 1:1 without fanout."
          - "All normalized recipe units equal the matched ingredient unit."
          - "quantity is non-null and observed from 1 through 12."
          - "The recipe rollup produces 120 unique potion SKUs from all 406 components."
    - relation: source('alembic_ops', 'raw_brew_events')
      established:
        grain: one row per brew batch
        primary_key: [brew_id]
        important_findings:
          - "20,000,000 rows; brew_id has zero nulls and zero duplicates."
          - "lower(trim(quality_check)) yields exactly pass and fail."
          - "brewed_at has zero nulls and zero timestamp_ntz cast failures."
          - "batch_size is non-null and observed from 25 through 250."
          - "brew_duration_minutes has 200,000 nulls and non-null values from 20 through 240."
  existing_patterns:
    - path: macros/to_boolean.sql
      established:
        - "Recognized true/false encodings are normalized case-insensitively; unknowns become null so tests surface bad values."
    - path: macros/copper_to_gold.sql
      established:
        - "Divides cast copper by 100.0, rounds to two decimals, and supports number(38, 2) reporting fields."
    - path: models/marts/_marts.yml
      established:
        - "Public marts enforce contracts and cast all SQL outputs to matching declared data types."
  data_profiles:
    - subject: source keys and source grains
      established: "All four planned staging sources satisfy their documented singular or composite keys."
      evidence_type: "dbt show --inline production-consistent aggregate profile with --favor-state"
    - subject: post-transformation categorical and boolean values
      established: "Units, quality, hazardous booleans, and preserved harvest seasons match the planned test domains exactly."
      evidence_type: "dbt show --inline expression-level profile with --favor-state"
    - subject: recipe join and standard potion cost
      established: "406 components join without loss or fanout and aggregate to 120 unique potion costs; cost range is 356-9172 copper (3.56-91.72 gold), total 307873 copper across potion standards."
      evidence_type: "dbt show --inline join and formula controls with --favor-state"
    - subject: brew enrichment and batch cost
      established: "All 20,000,000 brews match exactly one potion cost; estimated batch costs range from 8900 to 2293000 copper; current control total is 7057929103363 copper."
      evidence_type: "dbt show --inline join and formula controls with --favor-state"

decisions:
  - id: D001
    question: "May recipe quantity be multiplied directly by ingredient unit cost without unit conversion?"
    evidence:
      - "Every lower(trim(recipe.unit)) equals lower(trim(ingredient.unit)) for all 406 recipe components."
      - "No project-owned conversion table or conversion rule exists."
    options:
      - id: direct_matching_units
        implication: "Treat each ingredient unit cost as the cost of the identically named recipe unit; all current rows are computable."
      - id: require_conversion_mapping
        implication: "Block cost implementation until a governed conversion mapping and formula are supplied."
    owner: procurement_data_product_owner
    status: approved
    approved_value: direct_matching_units
    rationale: "Explicit human selection of the recommended D001-D004 set; all 406 normalized recipe units match their ingredient units and no conversion rule is needed."
  - id: D002
    question: "What business meaning and formula should the published supply-cost fields use?"
    evidence:
      - "Ingredient cost is the only available procurement cost; no purchase-order, invoice, waste, labor, or overhead inputs exist."
      - "Project requirement requests estimated standard potion cost and brew enrichment."
    options:
      - id: estimated_standard_cost
        implication: "Potion standard = sum(recipe quantity * current ingredient unit cost); batch estimate = potion standard * batch_size; failed brews remain included without adjustment."
      - id: actual_cost
        implication: "Block the product because actual procurement, waste, labor, and overhead data are unavailable."
    owner: procurement_data_product_owner
    status: approved
    approved_value: estimated_standard_cost
    rationale: "Explicit human selection of the recommended D001-D004 set; current sources support an estimated standard ingredient cost and do not support actual cost."
  - id: D003
    question: "How should missing brew_duration_minutes be represented?"
    evidence:
      - "200,000 of 20,000,000 current brew rows have null duration; no project-owned imputation rule exists."
    options:
      - id: preserve_null
        implication: "Keep duration nullable and distinguish unknown duration from a measured zero."
      - id: impute_value
        implication: "Requires an approved imputation value or method and changes the source meaning."
    owner: production_data_product_owner
    status: approved
    approved_value: preserve_null
    rationale: "Explicit human selection of the recommended D001-D004 set; null preserves unknown source duration without inventing an imputation rule."
  - id: D004
    question: "Approve the public grains and ordered interfaces enumerated for dim_suppliers and fct_brews?"
    evidence:
      - "The canonical target says one row per supplier and one row per brew batch."
      - "The proposed interfaces preserve source operational context and expose both copper and gold standard-cost fields."
    options:
      - id: canonical_full_interfaces
        implication: "Publish the exact contracted columns and order in this spec at supplier and brew grains."
      - id: revise_interfaces
        implication: "Provide the required additions, removals, types, or alternate grain before coherence validation."
    owner: analytics_product_owner
    status: approved
    approved_value: canonical_full_interfaces
    rationale: "Explicit human selection of the recommended D001-D004 set approves the exact grains, ordered columns, types, and contracts enumerated in this draft."
  - id: D005
    question: "Should this slice extend the dbt Semantic Layer now?"
    evidence:
      - "No existing Alembic semantic definition exists."
      - "The lab makes semantic extension optional and requires separate approval of cost and null semantics."
    options:
      - id: defer_semantic_extension
        implication: "Ship contracted marts only; consider governed production metrics in a separate approved change."
      - id: add_semantic_extension
        implication: "Requires an approved metric name, aggregation, entity, dimensions, time semantics, and consumer requirements before this plan can pass."
    owner: analytics_product_owner
    status: approved
    approved_value: defer_semantic_extension
    rationale: "Explicit human selection; this build publishes contracted marts and defers governed supply-cost metrics to a separate approved change."

models:
  - name: stg_alembic_ops__suppliers
    layer: staging
    path: models/wizard/staging/stg_alembic_ops__suppliers.sql
    properties_path: models/wizard/staging/_stg_alembic_ops.yml
    materialized: view
    description_requirement: "One row per supplier with typed rating and contract date."
    grain:
      description: one row per supplier
      key: [supplier_id]
    inputs:
      - source:
          name: alembic_ops
          table: raw_suppliers
    implementation:
      cte_shape: [source, renamed, final]
      joins: forbidden
      transformations:
        - "Cast reliability_rating to integer."
        - "Cast contracted_since to date."
        - "Use an explicit final interface; do not filter or deduplicate."
    output_columns:
      - {name: supplier_id, logical_type: varchar, source: "alembic_ops.raw_suppliers.supplier_id"}
      - {name: supplier_name, logical_type: varchar, source: "alembic_ops.raw_suppliers.supplier_name"}
      - {name: region, logical_type: varchar, source: "alembic_ops.raw_suppliers.region"}
      - {name: reliability_rating, logical_type: integer, derived_from: "raw_suppliers.reliability_rating::integer"}
      - {name: contracted_since, logical_type: date, derived_from: "raw_suppliers.contracted_since::date"}
    properties:
      description: "Supplier staging view at source grain with typed reliability and contract date."
      model_data_tests: []
      columns:
        - {name: supplier_id, data_type: null, description: "Primary key — supplier identifier.", data_tests: [unique, not_null]}
        - {name: supplier_name, data_type: null, description: "Supplier display name.", data_tests: [not_null]}
        - name: region
          data_type: null
          description: "Supplier region using the source's canonical region labels."
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
        - name: reliability_rating
          data_type: null
          description: "Supplier reliability rating from 1 through 5."
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [1, 2, 3, 4, 5]
        - {name: contracted_since, data_type: null, description: "Date the supplier contract began.", data_tests: [not_null]}
    contract:
      enforced: false
    acceptance_checks:
      - "Output row count equals raw_suppliers row count."
      - "supplier_id remains unique and non-null."
      - "No source supplier is filtered or duplicated."

  - name: stg_alembic_ops__ingredients
    layer: staging
    path: models/wizard/staging/stg_alembic_ops__ingredients.sql
    properties_path: models/wizard/staging/_stg_alembic_ops.yml
    materialized: view
    description_requirement: "One row per ingredient with normalized unit and hazard flag and copper/gold unit cost."
    grain:
      description: one row per ingredient
      key: [ingredient_id]
    inputs:
      - source:
          name: alembic_ops
          table: raw_ingredients
    implementation:
      cte_shape: [source, renamed, final]
      joins: forbidden
      transformations:
        - "Normalize unit as lower(trim(unit))."
        - "Cast unit_cost_copper to integer and derive unit_cost_gold with copper_to_gold(unit_cost_copper)."
        - "Normalize is_hazardous with to_boolean(is_hazardous)."
        - "Preserve harvest_season case and null semantics."
        - "Use an explicit final interface; do not filter or deduplicate."
    output_columns:
      - {name: ingredient_id, logical_type: varchar, source: "alembic_ops.raw_ingredients.ingredient_id"}
      - {name: ingredient_name, logical_type: varchar, source: "alembic_ops.raw_ingredients.ingredient_name"}
      - {name: supplier_id, logical_type: varchar, source: "alembic_ops.raw_ingredients.supplier_id"}
      - {name: unit, logical_type: varchar, derived_from: "lower(trim(raw_ingredients.unit))"}
      - {name: unit_cost_copper, logical_type: integer, derived_from: "raw_ingredients.unit_cost_copper::integer"}
      - {name: unit_cost_gold, logical_type: "number(38, 2)", derived_from: "copper_to_gold(raw_ingredients.unit_cost_copper)"}
      - {name: is_hazardous, logical_type: boolean, derived_from: "to_boolean(raw_ingredients.is_hazardous)"}
      - {name: harvest_season, logical_type: varchar, source: "alembic_ops.raw_ingredients.harvest_season"}
    properties:
      description: "Ingredient staging view at source grain with normalized units and hazardous flag and reporting currency."
      model_data_tests: []
      columns:
        - {name: ingredient_id, data_type: null, description: "Primary key — ingredient identifier.", data_tests: [unique, not_null]}
        - {name: ingredient_name, data_type: null, description: "Ingredient display name.", data_tests: [not_null]}
        - name: supplier_id
          data_type: null
          description: "FK to the ingredient's supplier."
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('stg_alembic_ops__suppliers')"
                  field: supplier_id
        - name: unit
          data_type: null
          description: "Ingredient purchasing/recipe unit, lowercased and trimmed."
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [bundle, dram, gram, pinch, sprig, vial]
        - {name: unit_cost_copper, data_type: null, description: "Current standard cost for one ingredient unit in copper pieces.", data_tests: [not_null]}
        - {name: unit_cost_gold, data_type: null, description: "Current standard cost for one ingredient unit in gold crowns (copper / 100).", data_tests: [not_null]}
        - {name: is_hazardous, data_type: null, description: "Whether the ingredient is hazardous after boolean normalization.", data_tests: [not_null]}
        - name: harvest_season
          data_type: null
          description: "Source harvest season with title case preserved."
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [Autumn, Spring, Summer, Winter, "Year-round"]
    contract:
      enforced: false
    acceptance_checks:
      - "Output row count equals raw_ingredients row count and ingredient_id remains unique."
      - "All normalized units are in the approved six-value domain."
      - "to_boolean() produces no nulls for current source encodings."
      - "unit_cost_gold equals round(unit_cost_copper / 100.0, 2) for every row."

