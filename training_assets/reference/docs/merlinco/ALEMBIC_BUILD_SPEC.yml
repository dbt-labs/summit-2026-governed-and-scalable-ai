    layer: intermediate
    path: models/wizard/intermediate/int_potion_supply_cost.sql
    properties_path: models/wizard/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: "One row per potion SKU with component count and estimated standard recipe supply cost."
    grain:
      description: one row per potion SKU
      key: [potion_sku]
    inputs:
      - ref: stg_alembic_ops__potion_ingredients
      - ref: stg_alembic_ops__ingredients
    implementation:
      cte_shape: [potion_ingredients, ingredients, recipe_components, final]
      joins: required
      transformations:
        - "Inner join each recipe component to one ingredient on ingredient_id."
        - "Require normalized recipe unit = normalized ingredient unit as a validated invariant; no conversion is applied under D001."
        - "Aggregate by potion_sku."
        - "ingredient_count = count(*)."
        - "standard_supply_cost_copper = sum(quantity * unit_cost_copper)::integer."
        - "standard_supply_cost_gold = copper_to_gold(sum(quantity * unit_cost_copper))."
      join_contracts:
        - left_input: stg_alembic_ops__potion_ingredients
          right_input: stg_alembic_ops__ingredients
          condition: "potion_ingredients.ingredient_id = ingredients.ingredient_id"
          cardinality: many-to-one
          join_type: inner
          record_retention: "Retain every recipe component; relationships tests and acceptance checks require zero unmatched rows."
          fanout_control: "ingredients.ingredient_id is unique; joined rows must equal recipe-component rows."
      aggregation:
        input_grain: one row per potion SKU and ingredient pair
        output_grain: one row per potion SKU
        group_by: [potion_sku]
        measures:
          - {name: ingredient_count, rule: "count(*)"}
          - {name: standard_supply_cost_copper, rule: "sum(quantity * unit_cost_copper)::integer"}
          - {name: standard_supply_cost_gold, rule: "copper_to_gold(sum(quantity * unit_cost_copper))"}
    output_columns:
      - {name: potion_sku, logical_type: varchar, source: "stg_alembic_ops__potion_ingredients.potion_sku"}
      - {name: ingredient_count, logical_type: integer, derived_from: "count(*)"}
      - {name: standard_supply_cost_copper, logical_type: integer, derived_from: "sum(quantity * unit_cost_copper)::integer"}
      - {name: standard_supply_cost_gold, logical_type: "number(38, 2)", derived_from: "copper_to_gold(sum(quantity * unit_cost_copper))"}
    properties:
      description: "Potion-grain rollup of estimated standard recipe supply cost at current ingredient unit costs."
      model_data_tests: []
      columns:
        - name: potion_sku
          data_type: null
          description: "Primary key — potion SKU."
          data_tests:
            - unique
            - not_null
            - relationships:
                arguments:
                  to: "ref('stg_abra_pos__potions')"
                  field: potion_sku
        - {name: ingredient_count, data_type: null, description: "Number of ingredient components in the standard recipe.", data_tests: [not_null]}
        - {name: standard_supply_cost_copper, data_type: null, description: "Estimated standard cost of ingredients for one potion in copper pieces.", data_tests: [not_null]}
        - {name: standard_supply_cost_gold, data_type: null, description: "Estimated standard cost of ingredients for one potion in gold crowns.", data_tests: [not_null]}
    contract:
      enforced: false
    acceptance_checks:
      - "Joined recipe-component row count equals staging recipe row count with zero unmatched ingredients or unit mismatches."
      - "Output has 120 rows and 120 unique non-null potion_sku values for the current source."
      - "Sum of ingredient_count equals 406 for the current source."
      - "standard_supply_cost_copper ranges from 356 through 9172 and sums to 307873 across current potion standards."
      - "standard_supply_cost_gold equals round(standard_supply_cost_copper / 100.0, 2)."

  - name: int_brews_with_supply_cost
    layer: intermediate
    path: models/wizard/intermediate/int_brews_with_supply_cost.sql
    properties_path: models/wizard/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: "Brew-batch grain enriched with standard per-potion and estimated batch supply cost."
