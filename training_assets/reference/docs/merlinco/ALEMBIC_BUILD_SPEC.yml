      - {name: standard_supply_cost_copper, logical_type: integer, source: "int_potion_supply_cost.standard_supply_cost_copper"}
      - {name: standard_supply_cost_gold, logical_type: "number(38, 2)", source: "int_potion_supply_cost.standard_supply_cost_gold"}
      - {name: estimated_batch_supply_cost_copper, logical_type: integer, derived_from: "batch_size * standard_supply_cost_copper"}
      - {name: estimated_batch_supply_cost_gold, logical_type: "number(38, 2)", derived_from: "copper_to_gold(batch_size * standard_supply_cost_copper)"}
      - {name: brewed_at, logical_type: timestamp_ntz, source: "stg_alembic_ops__brew_events.brewed_at"}
    properties:
      description: "Brew-batch enrichment that preserves every event and attaches estimated standard ingredient cost."
      model_data_tests: []
      columns:
        - {name: brew_id, data_type: null, description: "Primary key — brew batch identifier.", data_tests: [unique, not_null]}
        - {name: standard_supply_cost_gold, data_type: null, description: "Estimated standard ingredient cost for one potion in gold crowns.", data_tests: [not_null]}
        - {name: estimated_batch_supply_cost_gold, data_type: null, description: "Estimated standard ingredient cost for the full batch in gold crowns.", data_tests: [not_null]}
    contract:
      enforced: false
    acceptance_checks:
      - "Output row count and distinct brew_id both equal staging brew events; current expected value is 20000000."
      - "Every brew matches one non-null potion standard cost and no join fanout occurs."
      - "estimated_batch_supply_cost_copper equals batch_size * standard_supply_cost_copper for every row."
      - "estimated_batch_supply_cost_gold equals round(estimated_batch_supply_cost_copper / 100.0, 2)."
      - "Current estimated batch cost range is 8900 through 2293000 copper and control total is 7057929103363 copper."
      - "Duration null count and quality distribution equal staging brew events."

