    materialized: table
    description_requirement: Document the public brew-batch grain, retention, quality, nullable duration, and estimated-standard cost limitations.
    grain:
      description: one row per brew batch, subject to D004
      key: [brew_id]
    inputs:
      - ref: int_brews_with_supply_cost
