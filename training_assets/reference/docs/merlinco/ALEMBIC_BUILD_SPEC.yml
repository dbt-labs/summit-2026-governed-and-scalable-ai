            - accepted_values:
                arguments:
                  values: [pass, fail]
        - {name: brewer_name, data_type: varchar, description: "Recorded brewer name.", data_tests: [not_null]}
        - {name: batch_size, data_type: integer, description: "Number of potion units in the batch.", data_tests: [not_null]}
        - {name: brew_duration_minutes, data_type: integer, description: "Recorded duration in minutes; nullable when duration is unknown.", data_tests: []}
        - {name: standard_supply_cost_copper, data_type: integer, description: "Estimated standard ingredient cost for one potion in copper pieces.", data_tests: [not_null]}
        - {name: standard_supply_cost_gold, data_type: "number(38, 2)", description: "Estimated standard ingredient cost for one potion in gold crowns.", data_tests: [not_null]}
        - {name: estimated_batch_supply_cost_copper, data_type: integer, description: "Estimated standard ingredient cost for the full batch in copper pieces.", data_tests: [not_null]}
        - {name: estimated_batch_supply_cost_gold, data_type: "number(38, 2)", description: "Estimated standard ingredient cost for the full batch in gold crowns.", data_tests: [not_null]}
        - {name: brewed_at, data_type: timestamp_ntz, description: "Timestamp when the batch was brewed.", data_tests: [not_null]}
        - {name: brewed_date, data_type: date, description: "Calendar date derived from brewed_at.", data_tests: [not_null]}
    contract:
      enforced: true
    acceptance_checks:
      - "Output row count and distinct brew_id equal int_brews_with_supply_cost."
      - "Ordered SQL outputs exactly match all fourteen contracted properties columns and types."
      - "All source brews, including failed batches and null durations, are retained."
      - "Duration null count equals staging and intermediate; current expected count is 200000."
      - "Cost arithmetic and current copper control totals match int_brews_with_supply_cost."

