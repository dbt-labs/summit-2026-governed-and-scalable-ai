          description: Timestamp when the batch was brewed.
          data_tests: [not_null]
        - name: brewed_date
          data_type: date
          description: Calendar date derived from brewed_at.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('dim_dates')"
                  field: date_day
        - name: batch_size
          data_type: integer
          description: Number of potion units produced by the batch.
          data_tests: [not_null]
        - name: brew_duration_minutes
          data_type: integer
          description: Observed brew duration in minutes; nullable according to D003.
          data_tests: []
        - name: quality_check
          data_type: varchar
          description: Lowercased quality-check result.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [pass, fail]
        - name: brewer_name
          data_type: varchar
          description: Source-recorded brewer name.
          data_tests: [not_null]
        - name: estimated_standard_potion_supply_cost_copper
          data_type: integer
          description: Estimated current standard ingredient cost for one potion in copper; not actual spend.
          data_tests: [not_null]
        - name: estimated_standard_potion_supply_cost_gold
          data_type: number(38, 2)
          description: Estimated current standard ingredient cost for one potion in gold crowns; not actual spend.
          data_tests: [not_null]
        - name: estimated_standard_batch_supply_cost_copper
          data_type: integer
          description: Estimated current standard ingredient cost for the batch in copper; not actual spend.
          data_tests: [not_null]
        - name: estimated_standard_batch_supply_cost_gold
          data_type: number(38, 2)
          description: Estimated current standard ingredient cost for the batch in gold crowns; not actual spend.
          data_tests: [not_null]
    contract:
      enforced: true
    acceptance_checks:
      - contract enforces the exact fourteen-column public interface and data types
      - row count and brew_id set equal the approved D004 source population
      - potion, shop, and brewed_date relationships resolve
      - null duration behavior matches D003
      - estimated cost arithmetic reconciles to int_potion_supply_cost and batch_size under D001 and D002
      - all configured tests pass

semantic_scope:
  status: approved
  approved:
    - Deliver contracted dim_suppliers and fct_brews without a Semantic Layer extension in this build.
  deferred:
    - margin and profitability
    - production-to-sales or order allocation
    - actual procurement spend
    - all Alembic semantic models and metrics, pending a separate governed plan

validation:
  build_selector: +fct_brews +dim_suppliers
  structural_checks:
    exact_model_count: 8
    required_by_layer:
      staging: 4
      intermediate: 2
      marts: 2
    reject_unplanned_models: true
    reject_unplanned_columns: true
    reject_missing_tests: true
    reject_unapproved_lineage: true
  data_checks:
    - Each staging model preserves its source row count and approved grain.
    - All planned PK, composite-key, FK, required-field, and accepted-values tests pass with exact configured arguments.
    - Normalized recipe and ingredient units have zero mismatches under the D001 guardrail.
    - int_potion_supply_cost has one row for every recipe potion and reconciles component and currency arithmetic.
    - int_brews_with_supply_cost and fct_brews preserve the D004 brew population without fanout or missing costs.
    - Null brew durations follow D003 without silent filtering or imputation.
    - dim_suppliers and fct_brews enforce exact columns and contract data types.
    - Estimated standard cost fields and descriptions implement D002 and never claim actual spend.
    - Warehouse execution cost and materialization follow D006.

verification:
  status: not_run
  completed_at: null
  dbt_parse:
    status: not_run
    command: dbt parse
  dbt_build:
    status: not_run
    command: null
    invocation_id: null
  structural_checks:
    status: not_run
    findings: []
  data_checks:
    status: not_run
    findings: []
  deviations: []
  ready_for_review: false
