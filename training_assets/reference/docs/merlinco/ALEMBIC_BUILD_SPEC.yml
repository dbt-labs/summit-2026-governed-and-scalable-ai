version: 1

plan:
  name: alembic_procurement_wizard_build
  status: approved
  owner: authorized_requester
  approval:
    approved_by: authorized_requester
    evidence: Explicit approval of the complete plan in the dbt Studio planning conversation.
  target:
    track: wizard
    root_path: models/wizard



request:
  business_outcome: >
    Publish governed supplier reference data and brew-batch production facts with
    evidence-backed estimated standard supply costs for procurement, production,
    BI, and AI-assisted analysis.
  requested_products:
    - dim_suppliers
    - fct_brews
  intended_consumers:
    - procurement and production analysts
    - BI consumers of contracted marts
    - AI-assisted analytics consumers of governed data products
  out_of_scope:
    - margin or profitability metrics
    - allocation of production batches to sales or orders
    - actual procurement spend, invoices, purchase orders, or payment activity
    - changes to completed models outside models/wizard
    - implementation of any dbt model, properties file, metric, macro, or test during planning

authority:
  project_conventions:
    - path: AGENTS.md
      established: Wizard models use canonical names under a staging to intermediate to marts architecture; completed standard-layer models remain unchanged.
    - path: dbt_project.yml
      established: Wizard staging models are views, intermediate models are ephemeral, and marts are tables in the marts schema.
    - path: docs/merlinco/STYLE_GUIDE.md
      established: Staging is one source with cleanup only; joins and grain changes belong in intermediate; marts are contracted public products.
    - path: docs/merlinco/STYLE_GUIDE.md
      established: Preserve copper integers, expose gold as number(38, 2), use import and transformation CTEs followed by final, and apply grounded PK, FK, categorical, and required-field tests.
  source_structure:
    - path: models/staging/alembic_ops/_alembic_ops__sources.yml
      established: Declares raw_suppliers, raw_ingredients, raw_potion_ingredients, and raw_brew_events in source alembic_ops.
    - path: docs/merlinco/DATA_DICTIONARY.md
      established: Defines source columns, keys, mixed-case units and quality values, messy hazardous booleans, copper costs, and nullable brew duration.
    - path: docs/merlinco/ERD.md
      established: Defines supplier-to-ingredient, ingredient-to-recipe, potion-to-recipe, potion-to-brew, and shop-to-brew relationships and source grains.
  target_requirements:
    - path: docs/merlinco/LAB_procurement_slice.md
      established: Requires four staging models, two intermediate models, dim_suppliers, and fct_brews with the specified canonical lineage.
    - path: docs/merlinco/LAB_procurement_slice.md
      established: Requires mart contracts, warehouse-backed grain and arithmetic checks, and dbt build --select +fct_brews +dim_suppliers.
    - path: models/wizard/README.md
      established: Requires canonical unsuffixed names and colocated Wizard properties YAML under mirrored layer paths.
  implementation_patterns:
    - path: models/staging/abra_pos/stg_abra_pos__potions.sql
      established: Demonstrates lower(trim()), to_boolean(), copper_to_gold(), typed casts, ordered output columns, and one-source staging shape.
    - path: models/intermediate/int_orders_with_payments.sql
      established: Demonstrates pre-aggregation before joins, left-join record retention, fanout control, and explicit final output ordering.
    - path: models/intermediate/int_order_items_with_order_context.sql
      established: Demonstrates enriching an event grain without changing that grain.
    - path: models/marts/dim_potions.sql
      established: Demonstrates explicit contract-aligned casts in a one-input dimension.
    - path: models/marts/fct_orders.sql
      established: Demonstrates a contracted event-grain fact with IDs, attributes, measures, timestamp, and derived date.
    - path: models/marts/_marts.yml
      established: Demonstrates enforced contracts, complete mart data types, modern data_tests syntax, relationships arguments, and inline semantic declarations.
    - path: macros/to_boolean.sql
      established: Unrecognized boolean encodings become null so tests expose bad source values.
    - path: macros/copper_to_gold.sql
      established: Gold values are rounded copper divided by 100.0 and represented as number(38, 2).
  semantic_definitions:
    - path: models/marts/_marts.yml
      established: Existing semantic models and metrics are attached only to validated contracted facts; no Alembic metric or semantic definition currently exists.
    - path: docs/merlinco/STYLE_GUIDE.md
      established: Any Alembic semantic extension requires approved cost, unit, time, and null semantics.

evidence:
  sources:
    - relation: source('alembic_ops', 'raw_suppliers')
      established:
        grain: one row per supplier
        primary_key: [supplier_id]
        important_findings:
          - 15 rows and 15 distinct non-null supplier IDs
          - no nulls in supplier_name, region, reliability_rating, or contracted_since
          - reliability ratings span 1 through 5
          - supplier regions use the five canonical region labels
    - relation: source('alembic_ops', 'raw_ingredients')
      established:
        grain: one row per ingredient
        primary_key: [ingredient_id]
        important_findings:
          - 80 rows and 80 distinct non-null ingredient IDs
          - every ingredient has a valid supplier and no planned field is null
          - unit costs are positive and span 4 through 219 copper
          - normalized units are bundle, dram, gram, pinch, sprig, and vial
          - hazardous values are fully recognized by to_boolean()
    - relation: source('alembic_ops', 'raw_potion_ingredients')
      established:
        grain: one row per potion SKU and ingredient pair
        primary_key: [potion_sku, ingredient_id]
        important_findings:
          - 406 rows and 406 distinct composite keys with no key, quantity, or unit nulls
          - covers all 120 potions and all 80 ingredients
          - each potion has 2 through 5 recipe components
          - normalized recipe units match normalized ingredient units on all 406 rows
    - relation: source('alembic_ops', 'raw_brew_events')
      established:
        grain: one row per brew batch
        primary_key: [brew_id]
        important_findings:
          - 20000000 rows and 20000000 distinct non-null brew IDs
          - no nulls in potion_sku, shop_id, cauldron_id, brewed_at, batch_size, quality_check, or brewer_name
          - 200000 brew_duration_minutes values are null, exactly 1 percent of rows
          - batch size spans 25 through 250
          - brewed_at spans 2023-08-13 through 2026-08-11 and all values cast to timestamp_ntz
          - normalized quality values are pass and fail
    - relation: source('abra_pos', 'raw_potions')
      established:
        grain: one row per potion SKU
        primary_key: [potion_sku]
        important_findings:
          - all recipe and brew potion SKUs have a matching potion
    - relation: source('alembic_ops', 'raw_shops')
      established:
        grain: one row per shop
        primary_key: [shop_id]
        important_findings:
          - all brew shop IDs have a matching shop
  existing_patterns:
    - path: models/staging/alembic_ops/stg_alembic_ops__shops.sql
      established:
        - Alembic staging reads one source and preserves source grain.
        - Source-facing date values use explicit date casts.
    - path: models/staging/abra_pos/_stg_abra_pos.yml
      established:
        - Staging PKs use unique and not_null tests.
        - Staging FKs use relationships tests and normalized categories use accepted_values.
    - path: models/intermediate/_int.yml
      established:
        - Intermediate properties document and test grain-defining keys without contracts.
    - path: models/marts/_marts.yml
      established:
        - Public mart columns are fully enumerated with data types and contracts are enforced.
  data_profiles:
    - subject: source key validity and referential integrity
      established: Zero duplicate or null source keys and zero orphans across ingredient-to-supplier, recipe-to-ingredient, recipe-to-potion, brew-to-potion, and brew-to-shop relationships.
      evidence_type: production-consistent dbt show with --favor-state
    - subject: unit compatibility
      established: Six normalized units occur in both ingredient and recipe data, with zero row-level normalized unit mismatches; no conversion table or independent business definition of per-unit comparability exists.
      evidence_type: production-consistent dbt show with --favor-state plus project documentation
    - subject: estimated standard recipe cost
      established: All 120 potion recipes can be costed as sum(recipe quantity multiplied by current ingredient unit cost), spanning 356 through 9172 copper per potion.
      evidence_type: production-consistent dbt show with --favor-state
    - subject: brew enrichment retention and arithmetic
      established: A left join from all brews to potion cost preserves 20000000 rows and distinct brew IDs with zero null estimated costs; batch-size multiplication yields 8900 through 2293000 copper per brew.
      evidence_type: production-consistent dbt show with --favor-state
    - subject: castability
      established: Zero invalid supplier ratings or dates, ingredient costs or hazardous flags, recipe quantities, brew timestamps, batch sizes, or non-null brew durations.
      evidence_type: production-consistent dbt show with --favor-state

decisions:
  - id: D001_unit_comparability
    question: May matching normalized recipe and ingredient unit labels be treated as directly comparable with no unit conversion?
    evidence:
      - All 406 recipe rows match ingredient units after lower(trim()).
      - The six observed units are bundle, dram, gram, pinch, sprig, and vial.
      - No conversion table or quantity-normalization authority exists in the project.
    options:
      - id: direct_match_with_guardrail
        implication: Compute costs only when normalized units match and fail validation on any future mismatch; supports the requested build with current data.
      - id: require_conversion_authority
        implication: Block cost publication until a domain-owned conversion or equivalence table is supplied.
      - id: null_ambiguous_costs
        implication: Preserve recipe rows but set mismatched component and downstream batch costs to null; weakens mart completeness.
    recommendation: direct_match_with_guardrail
    owner: authorized_requester
    status: approved
    approved_value: direct_match_with_guardrail
    rationale: Matching normalized labels are accepted as directly comparable for this build, with validation required to fail on future mismatches.

  - id: D002_cost_meaning
    question: What business meaning should the recipe and brew supply-cost fields carry?
    evidence:
      - Available data contains current ingredient unit costs, recipe quantities, and brew batch sizes.
      - No purchase orders, invoices, effective-dated ingredient costs, waste, yield loss, or batch-level actual consumption exists.
      - The direct formula costs every potion and brew without nulls.
    options:
      - id: estimated_standard_cost
        implication: Define potion cost as current recipe quantity times current ingredient unit cost and batch cost as potion standard cost times batch size; explicitly not actual spend.
      - id: recipe_cost_only
        implication: Publish only estimated per-potion recipe cost and omit the estimated batch cost from fct_brews.
      - id: actual_cost
        implication: Block the build because the available sources cannot support actual procurement or realized production cost.
    recommendation: estimated_standard_cost
    owner: authorized_requester
    status: approved
    approved_value: estimated_standard_cost
    rationale: Available sources support an estimated standard cost based on current catalog costs; public names and descriptions must state that it is not actual spend.

  - id: D003_null_brew_duration
    question: How should null brew_duration_minutes values be represented in the public fact?
    evidence:
      - 200000 of 20000000 brew rows have null duration, exactly 1 percent.
      - All non-null duration values cast successfully.
      - No authoritative imputation rule exists.
    options:
      - id: preserve_null
        implication: Retain every brew and keep unknown duration null; do not apply a not_null test to duration.
      - id: filter_incomplete_brews
        implication: Remove 1 percent of source brew events and change source-to-fact retention.
      - id: impute_duration
        implication: Requires a separately approved imputation method and makes observed and estimated durations indistinguishable unless another field is added.
    recommendation: preserve_null
    owner: authorized_requester
    status: approved
    approved_value: preserve_null
    rationale: Preserve unknown observations faithfully and avoid unsupported filtering or imputation.

  - id: D004_public_brew_interface
    question: Should fct_brews publish one row for every source brew batch, including failed quality checks and null durations?
    evidence:
      - The lab target names one row per brew batch as the intended public grain.
      - Brew IDs are unique and all potion and shop FKs are valid.
      - The source contains pass and fail outcomes, and 1 percent null durations.
    options:
      - id: all_brew_events
        implication: Preserve all 20000000 source events at brew_id grain and expose quality_check for consumer filtering.
      - id: passed_brews_only
        implication: Exclude 1428571 failed quality checks and make fct_brews a filtered production-success fact.
      - id: complete_passed_brews_only
        implication: Exclude failed quality checks and rows with unknown duration, creating the narrowest interface and greatest source attrition.
    recommendation: all_brew_events
    owner: authorized_requester
    status: approved
    approved_value: all_brew_events
    rationale: The public fact preserves the documented source event grain and exposes quality and duration completeness for downstream filtering.

  - id: D005_semantic_scope
    question: Should this build add a dbt Semantic Layer definition or metrics for fct_brews?
    evidence:
      - No existing Alembic semantic model or metric is defined.
      - Project policy requires approved cost, unit, time, and null semantics before semantic extension.
      - Margin and production-to-sales allocation are explicitly outside the requested build.
    options:
      - id: defer_semantic_extension
        implication: Deliver the two contracted marts only and route future governed metrics through a separate approved semantic plan.
      - id: enable_fact_without_metrics
        implication: Register fct_brews as a semantic model with entities, dimensions, and measures after D001 through D004 are approved, but publish no metrics.
      - id: add_cost_and_brew_metrics
        implication: Requires exact metric names, aggregation behavior, time dimension, labels, and owners to be approved in this plan.
    recommendation: defer_semantic_extension
    owner: authorized_requester
    status: approved
    approved_value: defer_semantic_extension
    rationale: Deliver contracted marts in this slice and govern any semantic model or metrics through a separate definition and approval workflow.

  - id: D006_mart_materialization_cost
    question: Should fct_brews follow the configured table materialization despite the 20000000-row production source?
    evidence:
      - dbt_project.yml configures Wizard marts as tables.
      - The definition of done requires a warehouse-backed build of fct_brews and dim_suppliers.
      - Production raw_brew_events contains 20000000 rows, materially above the row counts described in workshop documentation.
    options:
      - id: full_table
        implication: Conforms to project policy and keeps implementation simple, with a full 20000000-row rebuild during validation and each subsequent run.
      - id: incremental_exception
        implication: Reduces recurring work but requires an approved unique_key, load watermark, late-arriving update policy, full-refresh policy, and project-config exception.
      - id: smaller_approved_environment
        implication: Keep table materialization but approve validation and workshop execution against a smaller provisioned source tier before production-scale execution.
    recommendation: full_table
    owner: authorized_requester
    status: approved
    approved_value: full_table
    rationale: Follow the configured Wizard mart policy and workshop definition of done despite the observed production-scale row count.

  - id: D007_accountable_ownership
    question: Who owns this plan and who may approve its business meaning and public interfaces?
    evidence:
      - SECURITY.md requires an authorized human to own business metric and data-product decisions.
      - Repository policy does not name the individual or accountable role for this slice.
    options:
      - id: requester_as_accountable_owner
        implication: Record the requesting human as plan owner and approver for D001 through D006 if they hold the required domain and platform authority.
      - id: named_domain_and_platform_delegates
        implication: Record separate procurement, production, analytics product, and analytics engineering approvers before plan approval.
    recommendation: requester_as_accountable_owner_if_authorized
    owner: authorized_requester
    status: approved
    approved_value: requester_as_accountable_owner
    rationale: The requester explicitly confirmed the recommended bundle and authorized-requester ownership in the planning conversation.


models:
  - name: stg_alembic_ops__suppliers
    layer: staging
    path: models/wizard/staging/stg_alembic_ops__suppliers.sql
    properties_path: models/wizard/staging/_stg_alembic_ops.yml
    materialized: view
    description_requirement: Document one row per supplier, source cleanup, and reliability rating meaning.
    grain:
      description: one row per supplier
      key: [supplier_id]
    inputs:
      - source:
          name: alembic_ops
          table: raw_suppliers
    implementation:
      cte_shape: [source, renamed, final_select]
      joins: forbidden
      transformations:
        - trim identifier and text fields without changing canonical region labels
        - cast reliability_rating to integer
        - cast contracted_since to date
      join_contracts: []
      aggregation: null
    output_columns:
      - name: supplier_id
        logical_type: varchar
        source: raw_suppliers.supplier_id
      - name: supplier_name
        logical_type: varchar
        source: raw_suppliers.supplier_name
      - name: region
        logical_type: varchar
        source: raw_suppliers.region
      - name: reliability_rating
        logical_type: integer
        derived_from: raw_suppliers.reliability_rating cast to integer
      - name: contracted_since
        logical_type: date
        derived_from: raw_suppliers.contracted_since cast to date
    properties:
      description: One row per ingredient supplier with canonical region, reliability rating, and contract start date.
      model_data_tests: []
      columns:
        - name: supplier_id
          description: Primary key for an ingredient supplier.
          data_tests: [unique, not_null]
        - name: supplier_name
          description: Supplier display name.
          data_tests: [not_null]
        - name: region
          description: Canonical supplier region.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [Northern Reaches, Ember Coast, Silverwood, The Marshlands, Crystal Vale]
        - name: reliability_rating
          description: Supplier reliability rating from 1 through 5.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [1, 2, 3, 4, 5]
                  quote: false
        - name: contracted_since
          description: Date the supplier contract began.
          data_tests: [not_null]
    contract:
      enforced: false
    acceptance_checks:
      - row count and distinct supplier_id count both equal the source row count
      - reliability_rating remains within 1 through 5
      - no unplanned columns

  - name: stg_alembic_ops__ingredients
    layer: staging
    path: models/wizard/staging/stg_alembic_ops__ingredients.sql
    properties_path: models/wizard/staging/_stg_alembic_ops.yml
    materialized: view
    description_requirement: Document one row per ingredient, supplier relationship, normalized unit, costs, hazardous flag, and harvest season.
    grain:
      description: one row per ingredient
      key: [ingredient_id]
    inputs:
      - source:
          name: alembic_ops
          table: raw_ingredients
    implementation:
      cte_shape: [source, renamed, final_select]
      joins: forbidden
      transformations:
        - trim identifiers and names
        - cast supplier and ingredient identifiers to varchar-compatible values
        - normalize unit with lower(trim(unit))
        - cast unit_cost_copper to integer
        - derive unit_cost_gold with copper_to_gold(unit_cost_copper)
        - normalize is_hazardous with to_boolean(is_hazardous)
        - preserve source harvest_season labels
      join_contracts: []
      aggregation: null
    output_columns:
      - name: ingredient_id
        logical_type: varchar
        source: raw_ingredients.ingredient_id
      - name: ingredient_name
        logical_type: varchar
        source: raw_ingredients.ingredient_name
      - name: supplier_id
        logical_type: varchar
        source: raw_ingredients.supplier_id
      - name: unit
        logical_type: varchar
        derived_from: lower(trim(raw_ingredients.unit))
      - name: unit_cost_copper
        logical_type: integer
        derived_from: raw_ingredients.unit_cost_copper cast to integer
      - name: unit_cost_gold
        logical_type: number(38, 2)
        derived_from: copper_to_gold(raw_ingredients.unit_cost_copper)
      - name: is_hazardous
        logical_type: boolean
        derived_from: to_boolean(raw_ingredients.is_hazardous)
      - name: harvest_season
        logical_type: varchar
        source: raw_ingredients.harvest_season
    properties:
      description: One row per ingredient with its supplier, normalized unit, current catalog unit cost, hazardous flag, and harvest season.
      model_data_tests: []
      columns:
        - name: ingredient_id
          description: Primary key for an ingredient.
          data_tests: [unique, not_null]
        - name: ingredient_name
          description: Ingredient display name.
          data_tests: [not_null]
        - name: supplier_id
          description: Foreign key to the ingredient supplier.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('stg_alembic_ops__suppliers')"
                  field: supplier_id
        - name: unit
          description: Lowercased unit in which the ingredient is costed.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [bundle, dram, gram, pinch, sprig, vial]
        - name: unit_cost_copper
          description: Current catalog cost for one ingredient unit in copper pieces.
          data_tests: [not_null]
        - name: unit_cost_gold
          description: Current catalog cost for one ingredient unit in gold crowns.
          data_tests: [not_null]
        - name: is_hazardous
          description: Whether the ingredient is classified as hazardous.
          data_tests: [not_null]
        - name: harvest_season
          description: Ingredient harvest season.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [autumn, spring, summer, winter, year-round]
    contract:
      enforced: false
    acceptance_checks:
      - row count and distinct ingredient_id count both equal the source row count
      - all supplier IDs resolve to stg_alembic_ops__suppliers
      - unit_cost_gold equals unit_cost_copper divided by 100.0 and rounded to two decimals
      - no unplanned columns

  - name: stg_alembic_ops__potion_ingredients
    layer: staging
    path: models/wizard/staging/stg_alembic_ops__potion_ingredients.sql
    properties_path: models/wizard/staging/_stg_alembic_ops.yml
    materialized: view
    description_requirement: Document recipe-component grain, composite key, recipe quantity, and normalized unit.
    grain:
      description: one row per potion SKU and ingredient pair
      key: [potion_sku, ingredient_id]
    inputs:
      - source:
          name: alembic_ops
          table: raw_potion_ingredients
    implementation:
      cte_shape: [source, renamed, final_select]
      joins: forbidden
      transformations:
        - trim potion and ingredient identifiers
        - cast quantity to integer
        - normalize unit with lower(trim(unit))
      join_contracts: []
      aggregation: null
    output_columns:
      - name: potion_sku
        logical_type: varchar
        source: raw_potion_ingredients.potion_sku
      - name: ingredient_id
        logical_type: varchar
        source: raw_potion_ingredients.ingredient_id
      - name: quantity
        logical_type: integer
        derived_from: raw_potion_ingredients.quantity cast to integer
      - name: unit
        logical_type: varchar
        derived_from: lower(trim(raw_potion_ingredients.unit))
    properties:
      description: Recipe bridge at one row per potion SKU and ingredient pair, with normalized units.
      model_data_tests:
        - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns: [potion_sku, ingredient_id]
      columns:
        - name: potion_sku
          description: Potion SKU that owns the recipe component.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('stg_abra_pos__potions')"
                  field: potion_sku
        - name: ingredient_id
          description: Ingredient included in the potion recipe.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('stg_alembic_ops__ingredients')"
                  field: ingredient_id
        - name: quantity
          description: Number of normalized ingredient units required by the standard recipe.
          data_tests: [not_null]
        - name: unit
          description: Lowercased recipe quantity unit.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [bundle, dram, gram, pinch, sprig, vial]
    contract:
      enforced: false
    acceptance_checks:
      - row count equals source row count and composite key remains unique
      - all potion and ingredient foreign keys resolve
      - normalized unit equals the corresponding ingredient unit for every row, subject to D001
      - no unplanned columns

  - name: stg_alembic_ops__brew_events
    layer: staging
    path: models/wizard/staging/stg_alembic_ops__brew_events.sql
    properties_path: models/wizard/staging/_stg_alembic_ops.yml
    materialized: view
    description_requirement: Document one row per brew batch, normalized quality, typed timestamp, nullable duration, and retained production attributes.
    grain:
      description: one row per brew batch
      key: [brew_id]
    inputs:
      - source:
          name: alembic_ops
          table: raw_brew_events
    implementation:
      cte_shape: [source, renamed, final_select]
      joins: forbidden
      transformations:
        - trim identifiers and brewer_name
        - cast brewed_at to timestamp_ntz
        - cast batch_size and non-null brew_duration_minutes to integer
        - normalize quality_check with lower(trim(quality_check))
        - preserve null brew_duration_minutes subject to D003
      join_contracts: []
      aggregation: null
    output_columns:
      - name: brew_id
        logical_type: varchar
        source: raw_brew_events.brew_id
      - name: potion_sku
        logical_type: varchar
        source: raw_brew_events.potion_sku
      - name: shop_id
        logical_type: varchar
        source: raw_brew_events.shop_id
      - name: cauldron_id
        logical_type: varchar
        source: raw_brew_events.cauldron_id
      - name: brewed_at
        logical_type: timestamp_ntz
        derived_from: raw_brew_events.brewed_at cast to timestamp_ntz
      - name: batch_size
        logical_type: integer
        derived_from: raw_brew_events.batch_size cast to integer
      - name: brew_duration_minutes
        logical_type: integer
        derived_from: nullable raw_brew_events.brew_duration_minutes cast to integer
      - name: quality_check
        logical_type: varchar
        derived_from: lower(trim(raw_brew_events.quality_check))
      - name: brewer_name
        logical_type: varchar
        source: raw_brew_events.brewer_name
    properties:
      description: One row per production brew batch with typed measures, normalized quality, and nullable observed duration.
      model_data_tests: []
      columns:
        - name: brew_id
          description: Primary key for a brew batch.
          data_tests: [unique, not_null]
        - name: potion_sku
          description: Potion produced by the brew batch.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('stg_abra_pos__potions')"
                  field: potion_sku
        - name: shop_id
          description: Shop that hosted the brew batch.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('stg_alembic_ops__shops')"
                  field: shop_id
        - name: cauldron_id
          description: Source-system cauldron identifier; no cauldron dimension exists.
          data_tests: [not_null]
        - name: brewed_at
          description: Brew timestamp represented as timestamp_ntz.
          data_tests: [not_null]
        - name: batch_size
          description: Number of potion units produced by the batch.
          data_tests: [not_null]
        - name: brew_duration_minutes
          description: Observed brew duration in minutes; nullable when duration was not recorded.
          data_tests: []
        - name: quality_check
          description: Lowercased batch quality-check result.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [pass, fail]
        - name: brewer_name
          description: Source-recorded brewer name.
          data_tests: [not_null]
    contract:
      enforced: false
    acceptance_checks:
      - row count and distinct brew_id count both equal the source row count
      - all potion and shop foreign keys resolve
      - null duration count follows the approved D003 behavior
      - no unplanned columns

  - name: int_potion_supply_cost
    layer: intermediate
    path: models/wizard/intermediate/int_potion_supply_cost.sql
    properties_path: models/wizard/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: Document estimated-standard cost semantics, recipe aggregation, unit guardrail, and one-row-per-potion grain.
    grain:
      description: one row per potion SKU
      key: [potion_sku]
    inputs:
      - ref: stg_alembic_ops__potion_ingredients
      - ref: stg_alembic_ops__ingredients
    implementation:
      cte_shape: [potion_ingredients, ingredients, recipe_components, potion_cost_rollup, final]
      joins: required
      transformations:
        - join each recipe component to its unique ingredient
        - assert normalized recipe unit equals normalized ingredient unit subject to D001
        - derive component cost as recipe quantity multiplied by current ingredient unit cost
        - aggregate component count and component costs to potion SKU
        - derive gold from the aggregated copper cost with copper_to_gold()
      join_contracts:
        - left_input: stg_alembic_ops__potion_ingredients
          right_input: stg_alembic_ops__ingredients
          condition: potion_ingredients.ingredient_id = ingredients.ingredient_id
          cardinality: many-to-one
          join_type: inner
          record_retention: retain every valid recipe component and reject unresolved ingredients through relationships tests
          fanout_control: ingredient_id is unique in stg_alembic_ops__ingredients
      aggregation:
        input_grain: one row per potion SKU and ingredient pair
        output_grain: one row per potion SKU
        group_by: [potion_sku]
        measures:
          - name: recipe_component_count
            rule: count recipe component rows
          - name: estimated_standard_potion_supply_cost_copper
            rule: sum(quantity multiplied by unit_cost_copper), subject to D001 and D002
          - name: estimated_standard_potion_supply_cost_gold
            rule: estimated_standard_potion_supply_cost_copper divided by 100.0 and rounded to two decimals
    output_columns:
      - name: potion_sku
        logical_type: varchar
        source: stg_alembic_ops__potion_ingredients.potion_sku
      - name: recipe_component_count
        logical_type: integer
        derived_from: count of recipe component rows per potion_sku
      - name: estimated_standard_potion_supply_cost_copper
        logical_type: integer
        derived_from: sum(quantity multiplied by unit_cost_copper) per potion_sku
      - name: estimated_standard_potion_supply_cost_gold
        logical_type: number(38, 2)
        derived_from: copper_to_gold(estimated_standard_potion_supply_cost_copper)
    properties:
      description: One row per potion SKU with component count and estimated standard recipe supply cost based on current ingredient catalog costs.
      model_data_tests: []
      columns:
        - name: potion_sku
          description: Primary key for the costed potion recipe.
          data_tests:
            - unique
            - not_null
            - relationships:
                arguments:
                  to: "ref('stg_abra_pos__potions')"
                  field: potion_sku
        - name: recipe_component_count
          description: Number of ingredient components in the standard recipe.
          data_tests: [not_null]
        - name: estimated_standard_potion_supply_cost_copper
          description: Estimated current standard ingredient cost for one potion in copper, subject to D001 and D002.
          data_tests: [not_null]
        - name: estimated_standard_potion_supply_cost_gold
          description: Estimated current standard ingredient cost for one potion in gold crowns, subject to D001 and D002.
          data_tests: [not_null]
    contract:
      enforced: false
    acceptance_checks:
      - exactly one unique row exists for each of the 120 recipe potion SKUs
      - recipe_component_count remains between 2 and 5
      - all normalized units match before component costs are summed
      - cost arithmetic reconciles to source recipe quantities and ingredient costs
      - gold equals aggregated copper divided by 100.0 and rounded to two decimals
      - no unplanned columns

  - name: int_brews_with_supply_cost
    layer: intermediate
    path: models/wizard/intermediate/int_brews_with_supply_cost.sql
    properties_path: models/wizard/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: Document brew-grain retention and distinguish per-potion estimated standard cost from estimated batch cost.
    grain:
      description: one row per brew batch
      key: [brew_id]
    inputs:
      - ref: stg_alembic_ops__brew_events
      - ref: int_potion_supply_cost
    implementation:
      cte_shape: [brew_events, potion_supply_cost, final]
      joins: required
      transformations:
        - left join potion standard cost to every brew event by potion_sku
        - preserve every brew event subject to D004
        - derive estimated batch supply cost as batch_size multiplied by estimated standard potion supply cost subject to D002
      join_contracts:
        - left_input: stg_alembic_ops__brew_events
          right_input: int_potion_supply_cost
          condition: brew_events.potion_sku = potion_supply_cost.potion_sku
          cardinality: many-to-one
          join_type: left
          record_retention: preserve every brew_id, including failed quality checks and null durations, subject to D003 and D004
          fanout_control: potion_sku is unique in int_potion_supply_cost
      aggregation: null
    output_columns:
      - name: brew_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.brew_id
      - name: potion_sku
        logical_type: varchar
        source: stg_alembic_ops__brew_events.potion_sku
      - name: shop_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.shop_id
      - name: cauldron_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.cauldron_id
      - name: brewed_at
        logical_type: timestamp_ntz
        source: stg_alembic_ops__brew_events.brewed_at
      - name: batch_size
        logical_type: integer
        source: stg_alembic_ops__brew_events.batch_size
      - name: brew_duration_minutes
        logical_type: integer
        source: stg_alembic_ops__brew_events.brew_duration_minutes
      - name: quality_check
        logical_type: varchar
        source: stg_alembic_ops__brew_events.quality_check
      - name: brewer_name
        logical_type: varchar
        source: stg_alembic_ops__brew_events.brewer_name
      - name: estimated_standard_potion_supply_cost_copper
        logical_type: integer
        source: int_potion_supply_cost.estimated_standard_potion_supply_cost_copper
      - name: estimated_standard_potion_supply_cost_gold
        logical_type: number(38, 2)
        source: int_potion_supply_cost.estimated_standard_potion_supply_cost_gold
      - name: estimated_standard_batch_supply_cost_copper
        logical_type: integer
        derived_from: batch_size multiplied by estimated_standard_potion_supply_cost_copper
      - name: estimated_standard_batch_supply_cost_gold
        logical_type: number(38, 2)
        derived_from: copper_to_gold(estimated_standard_batch_supply_cost_copper)
    properties:
      description: One row per brew batch enriched with estimated standard potion and batch supply costs while preserving source brew retention.
      model_data_tests: []
      columns:
        - name: brew_id
          description: Primary key for the enriched brew batch.
          data_tests: [unique, not_null]
        - name: potion_sku
          description: Potion produced by the brew batch.
          data_tests: [not_null]
        - name: estimated_standard_potion_supply_cost_gold
          description: Estimated standard ingredient cost for one potion in gold crowns.
          data_tests: [not_null]
        - name: estimated_standard_batch_supply_cost_gold
          description: Estimated standard ingredient cost for the batch in gold crowns.
          data_tests: [not_null]
    contract:
      enforced: false
    acceptance_checks:
      - row count and distinct brew_id count equal stg_alembic_ops__brew_events
      - no null estimated costs occur for currently valid potion relationships
      - batch copper cost equals batch_size multiplied by potion copper cost
      - batch gold cost equals batch copper cost divided by 100.0 and rounded to two decimals
      - no unplanned columns

