      - name: brew_duration_minutes
        logical_type: integer
        source: int_brews_with_supply_cost.brew_duration_minutes
      - name: quality_check
        logical_type: varchar
        source: int_brews_with_supply_cost.quality_check
      - name: brewer_name
        logical_type: varchar
        source: int_brews_with_supply_cost.brewer_name
      - name: estimated_standard_potion_supply_cost_copper
        logical_type: integer
        source: int_brews_with_supply_cost.estimated_standard_potion_supply_cost_copper
      - name: estimated_standard_potion_supply_cost_gold
        logical_type: number(38, 2)
        source: int_brews_with_supply_cost.estimated_standard_potion_supply_cost_gold
      - name: estimated_standard_batch_supply_cost_copper
        logical_type: integer
        source: int_brews_with_supply_cost.estimated_standard_batch_supply_cost_copper
      - name: estimated_standard_batch_supply_cost_gold
        logical_type: number(38, 2)
        source: int_brews_with_supply_cost.estimated_standard_batch_supply_cost_gold
    properties:
      description: Contracted brew-batch fact retaining approved source events and exposing estimated standard potion and batch supply costs, not actual spend.
      model_data_tests: []
      columns:
        - name: brew_id
          data_type: varchar
          description: Primary key for a brew batch.
          data_tests: [unique, not_null]
        - name: potion_sku
          data_type: varchar
          description: Foreign key to dim_potions.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('dim_potions')"
                  field: potion_sku
        - name: shop_id
          data_type: varchar
          description: Foreign key to dim_shops.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: "ref('dim_shops')"
                  field: shop_id
        - name: cauldron_id
          data_type: varchar
          description: Source-system cauldron identifier; no conformed cauldron dimension exists.
          data_tests: [not_null]
