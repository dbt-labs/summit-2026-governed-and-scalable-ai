version: 2

plan:
  name: alembic_procurement_and_brew_cost_slice
  status: approved
  owner: analytics_engineering
  approval:
    approved_by: authorized_human_via_dbt_studio
    evidence: "Explicit selection of 'Approve the complete spec' in this planning session on 2026-09-18."
  pre_approval_validation:
    status: passed
    checked_at: "2026-09-18T17:16:20.539Z"
    checked_by: dbt_studio_assistant
    checks:
      source_and_ref_columns_resolve: passed
      output_origins_match_transformations: passed
      tests_match_post_transformation_data: passed
      properties_and_contracts_match_outputs: passed
      lineage_grain_and_joins_are_coherent: passed
      formulas_and_acceptance_checks_reconcile: passed
      build_selector_covers_planned_models: passed
    findings:
      - All columns required from raw_suppliers, raw_ingredients, raw_potion_ingredients, and raw_brew_events exist in raw.dbt_jstayton with cast-compatible observed values.
      - Primary-key profiling found 15 unique suppliers, 80 unique ingredients, 406 unique recipe rows at the potion-plus-ingredient grain, and 20000000 unique brew events.
      - Post-normalization ingredient and recipe units are exactly bundle, dram, gram, pinch, sprig, and vial; recipe units match ingredient units on every joined row.
      - Post-normalization quality_check values are exactly pass and fail; to_boolean maps every observed is_hazardous value without producing null.
      - There are zero ingredient-to-supplier, recipe-to-potion, recipe-to-ingredient, brew-to-potion, and brew-to-shop orphans.
      - Recipe aggregation produces 120 potion-grain rows with 2 to 5 ingredients per potion and no brew lacks a current recipe cost.
      - A left join from brew events to potion cost preserves all 20000000 active-source brews at unique brew_id grain.
      - The active-source formula control total is 70579291033.63 gold for batch_size multiplied by potion standard unit supply cost.
      - brew_duration_minutes is intentionally nullable; 200000 active-source rows are null after empty-string handling, while all non-null values cast to integer.
      - The selector +dim_suppliers +fct_brews reaches all four planned staging models, both planned intermediate models, and both planned marts through declared inputs.
    unresolved: []
  target:
    track: wizard
    root_path: models/wizard/

request:
  business_outcome: >
    Provide governed supplier and brew-event products for procurement and production
    analysis, including a reproducible estimate of standard ingredient supply cost
    using the current ingredient catalog and standard potion recipes.
  requested_products:
    - dim_suppliers at one row per supplier for procurement analysis.
    - fct_brews at one row per brew event for production analysis with standard per-potion and estimated batch ingredient supply cost.
  intended_consumers:
    - procurement analysts
    - production analysts
    - BI and AI-assisted analysis over contracted marts
  out_of_scope:
    - actual procurement or purchase-order cost
    - ingredient cost history or as-of cost reconstruction
    - margin or profitability
    - production-to-sales allocation
    - Semantic Layer additions
    - filtering failed quality checks or any other brew-event exclusion

