  # --------------------------- INTERMEDIATE (1) --------------------------
  - name: int_potion_supply_cost
    layer: intermediate
    path: models/wizard/intermediate/int_potion_supply_cost.sql
    properties_path: models/wizard/intermediate/_int__wizard.yml
    materialized: ephemeral
    description_requirement: "One row per potion; standard ingredient supply cost from the recipe."

    grain:
      description: One row per potion (aggregated from recipe lines)
      key: [potion_sku]

    inputs:
      - ref: stg_alembic_ops__potion_ingredients
      - ref: stg_alembic_ops__ingredients

    implementation:
      cte_shape: [recipe, ingredients, recipe_costed, final]
      joins: required
      transformations:
        - "Join recipe lines to ingredients on ingredient_id to obtain unit_cost_copper per recipe line"
        - "Aggregate to potion grain: standard_supply_cost_copper = sum(quantity * unit_cost_copper)"
        - "Expose standard_supply_cost_gold via copper_to_gold on the summed copper value"
      join_contracts:
        - left_input: stg_alembic_ops__potion_ingredients
          right_input: stg_alembic_ops__ingredients
          condition: potion_ingredients.ingredient_id = ingredients.ingredient_id
          cardinality: many-to-one
          join_type: inner
          record_retention: "All 406 recipe lines retained; every ingredient_id resolves (full coverage)"
          fanout_control: "Ingredients is unique on ingredient_id, so the join does not fan out recipe lines"
      aggregation:
        input_grain: recipe line (potion_sku, ingredient_id)
        output_grain: potion (potion_sku)
        group_by: [potion_sku]
        measures:
          - name: standard_supply_cost_copper
            rule: "sum(quantity * unit_cost_copper) across the potion's recipe ingredients"

    output_columns:
      - name: potion_sku
        logical_type: varchar
        source: stg_alembic_ops__potion_ingredients.potion_sku
        derived_from: null
      - name: standard_supply_cost_copper
        logical_type: integer
        source: null
        derived_from: "sum(potion_ingredients.quantity * ingredients.unit_cost_copper)"
      - name: standard_supply_cost_gold
        logical_type: number(38, 2)
        source: null
        derived_from: "copper_to_gold(sum(potion_ingredients.quantity * ingredients.unit_cost_copper))"

    properties:
      description: >
        One row per potion. Standard ingredient supply cost to produce a single
        unit, summed over the recipe (recipe quantity * current ingredient unit cost).
      model_data_tests: []
      columns:
        - name: potion_sku
          data_type: null
          description: Primary key — one row per potion.
          data_tests: [unique, not_null]
        - name: standard_supply_cost_gold
          data_type: null
          description: Per-unit standard ingredient supply cost in gold crowns.
          data_tests: [not_null]

    contract:
      enforced: false

    acceptance_checks:
      - "Row count = 120 (one per potion)"
      - "potion_sku unique and not null"
      - "standard_supply_cost_copper between 356 and 9172 (control total); no nulls"

  # ------------------------------- MARTS (2) -----------------------------
  - name: dim_suppliers
    layer: marts
    path: models/wizard/marts/dim_suppliers.sql
    properties_path: models/wizard/marts/_marts__wizard.yml
    materialized: table
    description_requirement: "Supplier dimension — one row per supplier, for procurement analysis."

    grain:
      description: One row per supplier
      key: [supplier_id]

    inputs:
      - ref: stg_alembic_ops__suppliers

    implementation:
      cte_shape: [suppliers, final]
      joins: forbidden
      transformations:
        - "Explicitly cast every public column to its contracted data_type; no joins, no business logic"
      join_contracts: []

    output_columns:
      - name: supplier_id
        logical_type: varchar
        source: stg_alembic_ops__suppliers.supplier_id
        derived_from: "supplier_id::varchar (contract cast)"
      - name: supplier_name
        logical_type: varchar
        source: stg_alembic_ops__suppliers.supplier_name
        derived_from: "supplier_name::varchar (contract cast)"
      - name: region
        logical_type: varchar
        source: stg_alembic_ops__suppliers.region
        derived_from: "region::varchar (contract cast)"
      - name: reliability_rating
        logical_type: integer
        source: stg_alembic_ops__suppliers.reliability_rating
        derived_from: "reliability_rating::integer (contract cast)"
      - name: contracted_since
        logical_type: date
        source: stg_alembic_ops__suppliers.contracted_since
        derived_from: "contracted_since::date (contract cast)"

    properties:
      description: Supplier dimension — one row per ingredient supplier, for procurement analysis.
      model_data_tests: []
      columns:
        - name: supplier_id
          data_type: varchar
          description: Primary key — supplier identifier.
          data_tests: [unique, not_null]
        - name: supplier_name
          data_type: varchar
          description: Supplier display name.
        - name: region
          data_type: varchar
          description: Supplier home region (canonical spelling).
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
        - name: reliability_rating
          data_type: integer
          description: Supplier reliability rating, 1-5.
          data_tests: [not_null]
        - name: contracted_since
          data_type: date
          description: Date the supplier was first contracted.

    contract:
      enforced: true

    acceptance_checks:
      - "Row count = 15; supplier_id unique and not null"
      - "region in the 5 canonical values; reliability_rating between 1 and 5"
      - "Contract enforced: every public column present, ordered, and typed"

  - name: fct_brews
    layer: marts
    path: models/wizard/marts/fct_brews.sql
    properties_path: models/wizard/marts/_marts__wizard.yml
    materialized: table
    description_requirement: "Brew-event fact — one row per brew, with estimated standard ingredient supply cost."

    grain:
      description: One row per brew event
      key: [brew_id]

    inputs:
      - ref: stg_alembic_ops__brew_events
      - ref: int_potion_supply_cost

    implementation:
      cte_shape: [brews, potion_supply_cost, final]
      joins: required
      transformations:
        - "Left join brews to int_potion_supply_cost on potion_sku to attach the per-unit standard supply cost"
        - "standard_unit_supply_cost_gold = per-unit standard cost from int_potion_supply_cost (D1)"
        - "standard_batch_supply_cost_gold = standard_unit_supply_cost_gold * batch_size (D1)"
        - "Explicitly cast every public column to its contracted data_type"
      join_contracts:
        - left_input: stg_alembic_ops__brew_events
          right_input: int_potion_supply_cost
          condition: brews.potion_sku = potion_supply_cost.potion_sku
          cardinality: many-to-one
          join_type: left
          record_retention: "All 20,000,000 brew events preserved (left join); coverage currently 100%"
          fanout_control: "int_potion_supply_cost is unique on potion_sku, so no brew row fans out"

    output_columns:
      - name: brew_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.brew_id
        derived_from: "brew_id::varchar (contract cast)"
      - name: potion_sku
        logical_type: varchar
        source: stg_alembic_ops__brew_events.potion_sku
        derived_from: "potion_sku::varchar (contract cast)"
      - name: shop_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.shop_id
        derived_from: "shop_id::varchar (contract cast)"
      - name: cauldron_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.cauldron_id
        derived_from: "cauldron_id::varchar (contract cast)"
      - name: batch_size
        logical_type: integer
        source: stg_alembic_ops__brew_events.batch_size
        derived_from: "batch_size::integer (contract cast)"
      - name: brew_duration_minutes
        logical_type: integer
        source: stg_alembic_ops__brew_events.brew_duration_minutes
        derived_from: "brew_duration_minutes::integer (contract cast; nullable)"
      - name: quality_check
        logical_type: varchar
        source: stg_alembic_ops__brew_events.quality_check
        derived_from: "quality_check::varchar (contract cast)"
      - name: brewer_name
        logical_type: varchar
        source: stg_alembic_ops__brew_events.brewer_name
        derived_from: "brewer_name::varchar (contract cast)"
      - name: standard_unit_supply_cost_gold
        logical_type: number(38, 2)
        source: null
        derived_from: "int_potion_supply_cost.standard_supply_cost_gold::number(38,2) (D1 per-unit)"
      - name: standard_batch_supply_cost_gold
        logical_type: number(38, 2)
        source: null
        derived_from: "round(int_potion_supply_cost.standard_supply_cost_gold * batch_size, 2)::number(38,2) (D1 per-batch)"
      - name: brewed_at
        logical_type: timestamp_ntz
        source: stg_alembic_ops__brew_events.brewed_at
        derived_from: "brewed_at::timestamp_ntz (contract cast)"
      - name: brewed_date
        logical_type: date
        source: stg_alembic_ops__brew_events.brewed_date
        derived_from: "brewed_date::date (contract cast)"

    properties:
      description: >
        Brew-event fact — one row per production batch, with estimated standard
        ingredient supply cost (per unit and per batch) derived from recipe
        quantities and current ingredient unit costs.
      model_data_tests: []
      columns:
        - name: brew_id
          data_type: varchar
          description: Primary key — brew identifier.
          data_tests: [unique, not_null]
        - name: potion_sku
          data_type: varchar
          description: FK to dim_potions (potion brewed).
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('dim_potions')
                  field: potion_sku
        - name: shop_id
          data_type: varchar
          description: FK to dim_shops (shop that hosted the brew).
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('dim_shops')
                  field: shop_id
        - name: cauldron_id
          data_type: varchar
          description: Cauldron identifier (not a dimension table).
        - name: batch_size
          data_type: integer
          description: Number of potion units produced in the batch.
          data_tests: [not_null]
        - name: brew_duration_minutes
          data_type: integer
          description: Brew duration in minutes (nullable, ~1%).
        - name: quality_check
          data_type: varchar
          description: Batch quality-check result (lowercased).
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [pass, fail]
        - name: brewer_name
          data_type: varchar
          description: Name of the brewer.
        - name: standard_unit_supply_cost_gold
          data_type: number(38, 2)
          description: Per-unit standard ingredient supply cost in gold crowns (recipe standard).
          data_tests: [not_null]
        - name: standard_batch_supply_cost_gold
          data_type: number(38, 2)
          description: Standard ingredient supply cost for the whole batch (per-unit cost * batch_size), in gold crowns.
          data_tests: [not_null]
        - name: brewed_at
          data_type: timestamp_ntz
          description: Brew timestamp.
          data_tests: [not_null]
        - name: brewed_date
          data_type: date
          description: Brew date (date-truncated brewed_at).

    contract:
      enforced: true

    acceptance_checks:
      - "Row count = 20,000,000 (all brew events preserved)"
      - "brew_id unique and not null"
      - "standard_unit_supply_cost_gold and standard_batch_supply_cost_gold not null for every brew (100% recipe coverage)"
      - "standard_batch_supply_cost_gold = round(standard_unit_supply_cost_gold * batch_size, 2) on a sampled set"
      - "Every potion_sku resolves to dim_potions and every shop_id to dim_shops (D2-a)"
      - "quality_check in {pass, fail}"
      - "Contract enforced: every public column present, ordered, and typed"

