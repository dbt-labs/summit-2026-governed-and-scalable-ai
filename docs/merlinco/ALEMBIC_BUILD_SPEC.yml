      marts: 2
    reject_unplanned_models: true
    reject_unplanned_columns: true
    reject_missing_tests: true
    reject_unapproved_lineage: true
  data_checks:
    - "row counts: stg_alembic_ops__suppliers = 15, stg_alembic_ops__ingredients = 80, stg_alembic_ops__potion_ingredients = 406, stg_alembic_ops__brew_events = source row count, int_potion_supply_cost = 120, dim_suppliers = 15, fct_brews = source raw_brew_events row count."
    - "int_potion_supply_cost.recipe_cost_gold is never null or <= 0 for any of the 120 potions."
    - "fct_brews.batch_supply_cost_gold is never null; recomputing recipe_cost_gold * batch_size from fct_brews columns reconciles exactly."
    - "fct_brews.potion_sku fully resolves against dim_potions; fct_brews.shop_id fully resolves against dim_shops."
    - "accepted_values domains (region, unit, quality_check, harvest_season) reflect only the values profiled above."

