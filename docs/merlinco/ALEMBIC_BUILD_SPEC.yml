  - name: int_potion_supply_cost
    layer: intermediate
    path: models/wizard/intermediate/int_potion_supply_cost.sql
    properties_path: models/wizard/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: "Potion-grain recipe supply-cost rollup from normalized recipe components and current ingredient costs."
    grain: {description: "one row per potion with a current standard recipe supply cost", key: [potion_sku]}
    inputs: [{ref: stg_alembic_ops__potion_ingredients}, {ref: stg_alembic_ops__ingredients}]
    implementation:
      cte_shape: [recipe_components, ingredients, final]
      joins: required
      transformations: ["Require normalized recipe.unit = ingredients.unit as a unit-compatibility guard.", "Calculate component_cost_copper as quantity * unit_cost_copper.", "Derive standard_supply_cost_gold with copper_to_gold(standard_supply_cost_copper)."]
      join_contracts:
        - {left_input: stg_alembic_ops__potion_ingredients, right_input: stg_alembic_ops__ingredients, condition: "recipe_components.ingredient_id = ingredients.ingredient_id and recipe_components.unit = ingredients.unit", cardinality: "many-to-one", join_type: inner, record_retention: "All recipe components must resolve to a current ingredient with the same normalized unit; fail the acceptance check if any do not.", fanout_control: "ingredient_id is unique in the right input; assert joined count remains 406."}
      aggregation:
        input_grain: "one row per potion and ingredient component"
        output_grain: "one row per potion"
        group_by: [potion_sku]
        measures:
          - {name: ingredient_count, rule: "count(*)"}
          - {name: standard_supply_cost_copper, rule: "sum(quantity * unit_cost_copper)::integer"}
    output_columns:
      - {name: potion_sku, logical_type: varchar, source: stg_alembic_ops__potion_ingredients.potion_sku, derived_from: null}
      - {name: ingredient_count, logical_type: integer, source: null, derived_from: "count(*) by potion_sku"}
      - {name: standard_supply_cost_copper, logical_type: integer, source: null, derived_from: "sum(stg_alembic_ops__potion_ingredients.quantity * stg_alembic_ops__ingredients.unit_cost_copper)"}
      - {name: standard_supply_cost_gold, logical_type: "number(38, 2)", source: null, derived_from: "copper_to_gold(standard_supply_cost_copper)"}
    properties:
      description: "One current standard ingredient-supply cost per potion recipe."
      model_data_tests: []
      columns:
        - {name: potion_sku, data_type: null, description: "Primary key — potion with a recipe cost.", data_tests: [unique, not_null]}
        - {name: ingredient_count, data_type: null, description: "Number of recipe components in the potion standard.", data_tests: [not_null]}
        - {name: standard_supply_cost_copper, data_type: null, description: "Current standard ingredient supply cost per potion in copper pieces.", data_tests: [not_null]}
        - {name: standard_supply_cost_gold, data_type: null, description: "Current standard ingredient supply cost per potion in gold crowns.", data_tests: [not_null]}
    contract: {enforced: false}
    acceptance_checks: ["Return 120 unique potion_sku rows; ingredient_count sums to 406.", "Zero unmatched or unit-mismatched recipe components; standard copper cost totals 307873."]

