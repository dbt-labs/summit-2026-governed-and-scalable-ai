  - name: int_potion_supply_cost
    layer: intermediate
    path: models/wizard/intermediate/int_potion_supply_cost.sql
    properties_path: models/wizard/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: Potion-grain standard recipe cost using recipe quantities and current ingredient unit costs.
    grain:
      description: one row per potion with a standard recipe
      key: [potion_sku]
    inputs:
      - ref: stg_alembic_ops__potion_ingredients
      - ref: stg_alembic_ops__ingredients
    implementation:
      cte_shape: [potion_ingredients, ingredients, recipe_lines, potion_cost_copper, final]
      joins: required
      transformations:
        - Join each recipe ingredient to its current ingredient catalog row.
        - Calculate recipe_line_cost_copper as quantity multiplied by unit_cost_copper.
        - Aggregate by potion_sku to ingredient_count and standard_unit_supply_cost_copper.
        - Derive standard_unit_supply_cost_gold with copper_to_gold from the aggregated copper total.
      join_contracts:
        - left_input: stg_alembic_ops__potion_ingredients
          right_input: stg_alembic_ops__ingredients
          condition: potion_ingredients.ingredient_id = ingredients.ingredient_id
          cardinality: many_to_one
          join_type: inner
          record_retention: Every validated recipe row is retained; relationship tests must fail before a missing ingredient can silently reduce cost.
          fanout_control: ingredient_id is unique in staged ingredients, so each recipe row joins at most once.
      aggregation:
        input_grain: one row per potion and ingredient recipe pair
        output_grain: one row per potion
        group_by: [potion_sku]
        measures:
          - name: ingredient_count
            rule: count(*)
          - name: standard_unit_supply_cost_copper
            rule: sum(quantity * unit_cost_copper)
          - name: standard_unit_supply_cost_gold
            rule: copper_to_gold(standard_unit_supply_cost_copper)
    output_columns:
      - name: potion_sku
        logical_type: varchar
        source: stg_alembic_ops__potion_ingredients.potion_sku
      - name: ingredient_count
        logical_type: integer
        derived_from: count of recipe rows grouped by potion_sku
      - name: standard_unit_supply_cost_copper
        logical_type: integer
        derived_from: sum(recipe quantity * current ingredient unit_cost_copper) by potion_sku
      - name: standard_unit_supply_cost_gold
        logical_type: number(38, 2)
        derived_from: copper_to_gold(standard_unit_supply_cost_copper)
    properties:
      description: Potion-grain current standard ingredient cost from recipe quantities and current catalog unit costs; values are not historical or actual procurement cost.
      model_data_tests: []
      columns:
        - name: potion_sku
          data_type: null
          description: Primary key and FK to the staged potion catalog.
          data_tests:
            - unique
            - not_null
            - relationships:
                arguments:
                  to: ref('stg_abra_pos__potions')
                  field: potion_sku
        - name: ingredient_count
          data_type: null
          description: Number of distinct recipe ingredient rows contributing to the potion standard cost.
          data_tests: [not_null]
        - name: standard_unit_supply_cost_copper
          data_type: null
          description: Standard ingredient cost for one potion unit in copper, equal to the sum of recipe quantity times current ingredient unit cost.
          data_tests: [not_null]
        - name: standard_unit_supply_cost_gold
          data_type: null
          description: Standard ingredient cost for one potion unit in gold, equal to standard_unit_supply_cost_copper divided by 100.
          data_tests: [not_null]
    contract:
      enforced: false
    acceptance_checks: [C05_potion_cost_grain_and_formula]

  - name: int_brews_with_supply_cost
    layer: intermediate
    path: models/wizard/intermediate/int_brews_with_supply_cost.sql
    properties_path: models/wizard/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: Brew-event grain enriched with potion standard unit and estimated batch supply cost while retaining every brew.
    grain:
      description: one row per brew event
      key: [brew_id]
    inputs:
      - ref: stg_alembic_ops__brew_events
      - ref: int_potion_supply_cost
    implementation:
      cte_shape: [brew_events, potion_supply_cost, final]
      joins: required
      transformations:
        - Left join potion-grain standard cost to every brew on potion_sku.
        - Calculate estimated_batch_supply_cost_copper as batch_size multiplied by standard_unit_supply_cost_copper.
        - Calculate estimated_batch_supply_cost_gold with copper_to_gold from the exact batch copper total.
        - Do not filter any brew based on quality result, duration, or cost coverage.
      join_contracts:
        - left_input: stg_alembic_ops__brew_events
          right_input: int_potion_supply_cost
          condition: brew_events.potion_sku = potion_supply_cost.potion_sku
          cardinality: many_to_one
          join_type: left
          record_retention: Preserve every brew event; missing cost remains null and must fail the planned cost completeness test.
          fanout_control: potion_sku is unique in int_potion_supply_cost, preserving brew_id grain.
      aggregation: null
    output_columns:
      - name: brew_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.brew_id
      - name: potion_sku
        logical_type: varchar
        source: stg_alembic_ops__brew_events.potion_sku
      - name: shop_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.shop_id
      - name: cauldron_id
        logical_type: varchar
        source: stg_alembic_ops__brew_events.cauldron_id
      - name: brewer_name
        logical_type: varchar
        source: stg_alembic_ops__brew_events.brewer_name
      - name: quality_check
        logical_type: varchar
        source: stg_alembic_ops__brew_events.quality_check
      - name: batch_size
        logical_type: integer
        source: stg_alembic_ops__brew_events.batch_size
      - name: brew_duration_minutes
        logical_type: integer
        source: stg_alembic_ops__brew_events.brew_duration_minutes
      - name: standard_unit_supply_cost_copper
        logical_type: integer
        source: int_potion_supply_cost.standard_unit_supply_cost_copper
      - name: standard_unit_supply_cost_gold
        logical_type: number(38, 2)
        source: int_potion_supply_cost.standard_unit_supply_cost_gold
      - name: estimated_batch_supply_cost_copper
        logical_type: integer
        derived_from: batch_size * standard_unit_supply_cost_copper
      - name: estimated_batch_supply_cost_gold
        logical_type: number(38, 2)
        derived_from: copper_to_gold(estimated_batch_supply_cost_copper)
      - name: brewed_at
        logical_type: timestamp_ntz
        source: stg_alembic_ops__brew_events.brewed_at
    properties:
      description: Brew-event grain enriched with current standard recipe cost; every brew is retained and nullable duration is preserved.
      model_data_tests: []
      columns:
        - name: brew_id
          data_type: null
          description: Primary key — brew event identifier.
          data_tests: [unique, not_null]
        - name: standard_unit_supply_cost_gold
          data_type: null
          description: Current standard ingredient cost for one potion unit in gold.
          data_tests: [not_null]
        - name: estimated_batch_supply_cost_gold
          data_type: null
          description: Estimated standard ingredient cost for the batch in gold, equal to batch_size times standard unit supply cost.
          data_tests: [not_null]
    contract:
      enforced: false
    acceptance_checks: [C06_enriched_brew_retention_and_formula]

  - name: dim_suppliers
    layer: marts
    path: models/wizard/marts/dim_suppliers.sql
    properties_path: models/wizard/marts/_marts.yml
    materialized: table
    description_requirement: Contracted supplier dimension at one row per supplier for procurement slicing.
    grain:
      description: one row per supplier
      key: [supplier_id]
    inputs:
      - ref: stg_alembic_ops__suppliers
    implementation:
      cte_shape: [suppliers, final]
      joins: forbidden
      transformations:
        - Cast every ordered public column to its declared contract type.
      aggregation: null
    output_columns:
      - name: supplier_id
        logical_type: varchar
        derived_from: stg_alembic_ops__suppliers.supplier_id cast to varchar
      - name: supplier_name
        logical_type: varchar
        derived_from: stg_alembic_ops__suppliers.supplier_name cast to varchar
      - name: region
        logical_type: varchar
        derived_from: stg_alembic_ops__suppliers.region cast to varchar
      - name: reliability_rating
        logical_type: integer
        derived_from: stg_alembic_ops__suppliers.reliability_rating cast to integer
      - name: contracted_since
        logical_type: date
        derived_from: stg_alembic_ops__suppliers.contracted_since cast to date
    properties:
      description: Supplier dimension at one row per supplier for procurement analysis.
      model_data_tests: []
      columns:
        - name: supplier_id
          data_type: varchar
          description: Primary key — supplier identifier.
          data_tests: [unique, not_null]
        - name: supplier_name
          data_type: varchar
          description: Supplier display name.
          data_tests: [not_null]
        - name: region
          data_type: varchar
          description: Canonical supplier region.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
        - name: reliability_rating
          data_type: integer
          description: Supplier reliability rating from 1 through 5.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [1, 2, 3, 4, 5]
                  quote: false
        - name: contracted_since
          data_type: date
          description: Date the supplier contract began.
          data_tests: [not_null]
    contract:
      enforced: true
    acceptance_checks: [C01_supplier_grain_and_retention]

  - name: fct_brews
    layer: marts
    path: models/wizard/marts/fct_brews.sql
    properties_path: models/wizard/marts/_marts.yml
    materialized: table
    description_requirement: Contracted brew-event fact preserving all production events with current standard recipe cost estimates.
    grain:
      description: one row per brew event
      key: [brew_id]
    inputs:
      - ref: int_brews_with_supply_cost
    implementation:
      cte_shape: [brews, final]
      joins: forbidden
      transformations:
        - Cast every ordered public column to its declared contract type.
        - Derive brewed_date by casting brewed_at to date.
        - Expose gold reporting values while keeping exact copper calculations in the intermediate lineage.
      aggregation: null
    output_columns:
      - name: brew_id
        logical_type: varchar
        derived_from: int_brews_with_supply_cost.brew_id cast to varchar
      - name: potion_sku
        logical_type: varchar
        derived_from: int_brews_with_supply_cost.potion_sku cast to varchar
      - name: shop_id
        logical_type: varchar
        derived_from: int_brews_with_supply_cost.shop_id cast to varchar
      - name: cauldron_id
        logical_type: varchar
        derived_from: int_brews_with_supply_cost.cauldron_id cast to varchar
      - name: brewer_name
        logical_type: varchar
        derived_from: int_brews_with_supply_cost.brewer_name cast to varchar
      - name: quality_check
        logical_type: varchar
        derived_from: int_brews_with_supply_cost.quality_check cast to varchar
      - name: batch_size
        logical_type: integer
        derived_from: int_brews_with_supply_cost.batch_size cast to integer
      - name: brew_duration_minutes
        logical_type: integer
        derived_from: int_brews_with_supply_cost.brew_duration_minutes cast to integer
      - name: standard_unit_supply_cost_gold
        logical_type: number(38, 2)
        derived_from: int_brews_with_supply_cost.standard_unit_supply_cost_gold cast to number(38, 2)
      - name: estimated_batch_supply_cost_gold
        logical_type: number(38, 2)
        derived_from: int_brews_with_supply_cost.estimated_batch_supply_cost_gold cast to number(38, 2)
      - name: brewed_at
        logical_type: timestamp_ntz
        derived_from: int_brews_with_supply_cost.brewed_at cast to timestamp_ntz
      - name: brewed_date
        logical_type: date
        derived_from: int_brews_with_supply_cost.brewed_at cast to date
    properties:
      description: >
        Brew-event fact preserving every production batch. Supply costs are estimates
        from standard recipe quantities and current ingredient catalog costs, not
        historical or actual procurement spend.
      model_data_tests: []
      columns:
        - name: brew_id
          data_type: varchar
          description: Primary key — brew event identifier.
          data_tests: [unique, not_null]
        - name: potion_sku
          data_type: varchar
          description: FK to dim_potions for the brewed potion.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('dim_potions')
                  field: potion_sku
        - name: shop_id
          data_type: varchar
          description: FK to dim_shops for the producing location.
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('dim_shops')
                  field: shop_id
        - name: cauldron_id
          data_type: varchar
          description: Operational cauldron identifier; no conformed dimension exists.
          data_tests: [not_null]
        - name: brewer_name
          data_type: varchar
          description: Name recorded for the brewer who produced the batch.
          data_tests: [not_null]
        - name: quality_check
          data_type: varchar
          description: Lowercased quality result; failed and passed brews are both retained.
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: [pass, fail]
        - name: batch_size
          data_type: integer
          description: Number of potion units produced in the batch.
          data_tests: [not_null]
        - name: brew_duration_minutes
          data_type: integer
          description: Recorded brew duration in minutes; nullable when the source omitted duration.
          data_tests: []
        - name: standard_unit_supply_cost_gold
          data_type: number(38, 2)
          description: Estimated standard ingredient cost for one potion unit in gold, using recipe quantities and current ingredient unit costs.
          data_tests: [not_null]
        - name: estimated_batch_supply_cost_gold
          data_type: number(38, 2)
          description: Estimated standard ingredient cost for the full batch in gold, equal to batch_size times standard_unit_supply_cost_gold.
          data_tests: [not_null]
        - name: brewed_at
          data_type: timestamp_ntz
          description: Brew event timestamp.
          data_tests: [not_null]
        - name: brewed_date
          data_type: date
          description: Calendar date derived from brewed_at for daily production analysis.
          data_tests: [not_null]
    contract:
      enforced: true
    acceptance_checks: [C07_fct_brews_contract_grain_retention_relationships_and_cost]

semantic_scope:
  status: deferred_by_request
  approved: []
  deferred:
    - No semantic model, entity, dimension, measure, metric, or saved query is created in this slice.
    - Any future production or procurement metric requires a separately approved governed semantic definition over validated Wizard marts.

validation:
  build_selector: +dim_suppliers +fct_brews
  structural_checks:
    exact_model_count: 8
    required_by_layer:
      staging: 4
      intermediate: 2
      marts: 2
    reject_unplanned_models: true
    reject_unplanned_columns: true
    reject_missing_tests: true
    reject_unapproved_lineage: true
  data_checks:
    - id: C01_supplier_grain_and_retention
      sql: >
        select count(*) - count(distinct supplier_id) as duplicate_keys,
        count_if(supplier_id is null) as null_keys from {{ ref('dim_suppliers') }}
      expected: one row with duplicate_keys = 0 and null_keys = 0; dim_suppliers row count must equal stg_alembic_ops__suppliers row count.
    - id: C02_ingredient_domains_and_supplier_relationship
      sql: >
        select count_if(unit not in ('bundle','dram','gram','pinch','sprig','vial')) as bad_units,
        count_if(is_hazardous is null) as unmapped_flags from {{ ref('stg_alembic_ops__ingredients') }}
      expected: one row with bad_units = 0 and unmapped_flags = 0; attached supplier relationship test passes.
    - id: C03_recipe_grain_relationships_and_units
      sql: >
        select count(*) - count(distinct potion_sku || '|' || ingredient_id) as duplicate_recipe_rows,
        count_if(quantity is null or unit is null) as incomplete_recipe_rows from {{ ref('stg_alembic_ops__potion_ingredients') }}
      expected: one row with duplicate_recipe_rows = 0 and incomplete_recipe_rows = 0; attached potion and ingredient relationship tests pass.
    - id: C04_brew_staging_grain_retention_and_domains
      sql: >
        select count(*) - count(distinct brew_id) as duplicate_brews,
        count_if(quality_check not in ('pass','fail')) as bad_quality_values from {{ ref('stg_alembic_ops__brew_events') }}
      expected: one row with duplicate_brews = 0 and bad_quality_values = 0; staged row count equals source row count.
    - id: C05_potion_cost_grain_and_formula
      sql: >
        select count(*) - count(distinct potion_sku) as duplicate_potions,
        count_if(ingredient_count < 1 or standard_unit_supply_cost_copper is null or standard_unit_supply_cost_gold is null) as invalid_cost_rows
        from {{ ref('int_potion_supply_cost') }}
      expected: one row with duplicate_potions = 0 and invalid_cost_rows = 0; recomputed recipe-line copper sum equals standard_unit_supply_cost_copper for every potion.
    - id: C06_enriched_brew_retention_and_formula
      sql: >
        select count(*) - count(distinct brew_id) as duplicate_brews,
        count_if(estimated_batch_supply_cost_copper <> batch_size * standard_unit_supply_cost_copper) as copper_formula_mismatches,
        count_if(estimated_batch_supply_cost_gold <> round(estimated_batch_supply_cost_copper / 100.0, 2)) as gold_formula_mismatches
        from {{ ref('int_brews_with_supply_cost') }}
      expected: one row with all three values = 0; row count equals stg_alembic_ops__brew_events.
    - id: C07_fct_brews_contract_grain_retention_relationships_and_cost
      sql: >
        select count(*) as fact_rows, count(distinct brew_id) as distinct_brews,
        count_if(standard_unit_supply_cost_gold is null or estimated_batch_supply_cost_gold is null) as null_cost_rows,
        round(sum(estimated_batch_supply_cost_gold), 2) as aggregate_estimated_batch_supply_cost_gold
        from {{ ref('fct_brews') }}
      expected: >
        fact_rows equals distinct_brews and the stg_alembic_ops__brew_events row count;
        null_cost_rows = 0; aggregate cost equals the independently recomputed recipe-times-batch control total.
    - id: C08_active_source_control_evidence
      sql: >
        with potion_cost as (
        select pi.potion_sku,
        sum(pi.quantity::integer * i.unit_cost_copper::integer) as standard_unit_supply_cost_copper
        from {{ source('alembic_ops', 'raw_potion_ingredients') }} pi
        inner join {{ source('alembic_ops', 'raw_ingredients') }} i
        on pi.ingredient_id = i.ingredient_id group by pi.potion_sku
        ), brew_cost as (
        select b.brew_id,
        b.batch_size::integer * pc.standard_unit_supply_cost_copper as estimated_batch_supply_cost_copper
        from {{ source('alembic_ops', 'raw_brew_events') }} b
        left join potion_cost pc on b.potion_sku = pc.potion_sku
        ) select count(*) as retained_brews, count(distinct brew_id) as distinct_brews,
        count_if(estimated_batch_supply_cost_copper is null) as missing_costs,
        round(sum(estimated_batch_supply_cost_copper) / 100.0, 2) as aggregate_estimated_batch_supply_cost_gold
        from brew_cost
      expected: >
        In the profiled active source snapshot: retained_brews = 20000000,
        distinct_brews = 20000000, missing_costs = 0, and
        aggregate_estimated_batch_supply_cost_gold = 70579291033.63. Recompute at
        implementation time and record explained source drift rather than hard-coding
        this value into models.

