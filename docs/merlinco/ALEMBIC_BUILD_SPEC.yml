version: 2

plan:
  name: alembic_procurement_wizard_build
  status: approved
  owner: analytics_engineering
  approval:
    approved_by: authorized_human
    evidence: "Explicit selection of 'Approve the proposed contracts' in the planning conversation on 2026-09-08 after all v2 coherence checks passed."
  pre_approval_validation:
    status: passed
    checked_at: "2026-09-08T03:40:00Z"
    checked_by: dbt_assistant
    checks:
      source_and_ref_columns_resolve: passed
      output_origins_match_transformations: passed
      tests_match_post_transformation_data: passed
      properties_and_contracts_match_outputs: passed
      lineage_grain_and_joins_are_coherent: passed
      formulas_and_acceptance_checks_reconcile: passed
      build_selector_covers_planned_models: passed
    findings:
      - "All four Alembic source tables and their declared columns resolve in raw.dbt_jstayton; existing refs dim_potions and dim_shops resolve in the active project model inventory."
      - "Every output has exactly one origin. Casts, lower(trim()) normalization, to_boolean(), copper_to_gold(), arithmetic, aggregation, and brewed_at::date are declared as derived_from."
      - "Warehouse profiles of the proposed output expressions support the exact test domains: normalized units are bundle, dram, gram, pinch, sprig, vial; quality_check is pass or fail; supplier regions and ratings match their proposed domains; all planned required fields are populated except 200000 intentionally nullable brew durations."
      - "All ordered mart output columns are fully enumerated with matching properties descriptions and contract types: dim_suppliers has five columns and fct_brews has fourteen."
      - "The eight planned models are uniquely named and topologically ordered. Staging preserves source grain; recipe cost aggregates 406 recipe components to 120 potion rows; brew enrichment is many-to-one with left-side brew retention and zero observed fanout; marts each have one input and no joins."
      - "Recipe quantities times current ingredient unit costs produce standard costs from 356 to 9172 copper; all 20000000 brews receive a cost, batch-cost copper totals 7057929103363, and copper/gold formula mismatches are zero."
      - "The selector +fct_brews +dim_suppliers reaches all four staging models, both intermediates, and both public marts through the declared lineage."
    unresolved: []
  target:
    track: wizard
    root_path: models/wizard/

request:
  business_outcome: >
    Publish governed supplier and brew-event products for procurement and production
    analysis. Estimate standard ingredient supply cost from current ingredient unit
    costs and recipe quantities while preserving every source brew event.
  requested_products:
    - dim_suppliers
    - fct_brews
  intended_consumers:
    - procurement analysts
    - production operations analysts
    - governed BI and AI-assisted analysis through contracted marts
  out_of_scope:
    - actual procurement, purchase-order, or invoice cost
    - labor, cauldron, overhead, waste, or failed-batch accounting adjustments
    - margin or profitability
    - production-to-sales allocation
    - Semantic Layer entities, dimensions, measures, or metrics
    - changes to completed starter-state models

authority:
  project_conventions:
    - path: AGENTS.md
      established: "Approved build specs govern planned work; human owners approve business meaning, public interfaces, and production impact."
    - path: dbt_project.yml
      established: "The configured model root is models/. Wizard staging, intermediate, and mart materializations are respectively view, ephemeral, and table."
    - path: docs/merlinco/STYLE_GUIDE.md
      established: "Staging is one-source cleanup, intermediate owns joins and grain changes, and public Wizard marts enforce contracts with explicit casts."
  source_structure:
    - path: models/staging/alembic_ops/_alembic_ops__sources.yml
      established: "Alembic Ops sources are declared as source('alembic_ops', ...), backed by raw.dbt_jstayton."
    - path: docs/merlinco/ERD.md
      established: "Suppliers, ingredients, recipe components, and brew events have the documented keys and intact referential integrity."
    - path: docs/merlinco/DATA_DICTIONARY.md
      established: "Recipe components use a potion/ingredient composite key; brew events are batch-grain; unit and quality fields need lowercase normalization; brew duration can be null."
  target_requirements:
    - path: user request
      established: "Deliver dim_suppliers and fct_brews under models/wizard/, preserve all brew events, use current ingredient costs and recipe quantities, and keep actual cost, margin, allocation, and Semantic Layer work out of scope."
  implementation_patterns:
    - path: models/staging/abra_pos/stg_abra_pos__potions.sql
      established: "Staging uses source, renamed, and final select structure with casts, macros, lower(trim()) cleanup, and paired copper/gold fields."
    - path: models/intermediate/int_order_items_with_order_context.sql
      established: "Intermediate joins explicitly preserve the stated left grain before a final select."
    - path: models/marts/dim_potions.sql
      established: "Marts use one ref input, explicit casts to contract types, a final CTE, and select * from final."
    - path: models/marts/fct_order_items.sql
      established: "Facts retain event keys and context, cast contract columns explicitly, and derive a date from an event timestamp."
    - path: macros/copper_to_gold.sql
      established: "Gold is round(copper::number(38,0) / 100.0, 2) with type number(38, 2)."
    - path: macros/to_boolean.sql
      established: "Recognized messy boolean encodings normalize to boolean; unrecognized values become null."
  semantic_definitions:
    - path: models/marts/_marts.yml
      established: "Existing semantic definitions attach only to completed marts. No Alembic semantic extension is authorized in this slice."

evidence:
  sources:
    - relation: raw.dbt_jstayton.raw_suppliers
      established:
        grain: one row per supplier
        primary_key: [supplier_id]
        important_findings:
          - "15 rows and 15 distinct, non-null supplier_id values."
          - "supplier_name, region, reliability_rating, and contracted_since are populated."
          - "Observed regions are Northern Reaches, Ember Coast, Silverwood, The Marshlands, and Crystal Vale; ratings are integers 1 through 5."
    - relation: raw.dbt_jstayton.raw_ingredients
      established:
        grain: one row per ingredient
        primary_key: [ingredient_id]
        important_findings:
          - "80 rows and 80 distinct ingredient_id values; required identifiers and current unit costs are populated."
          - "All hazardous encodings are recognized by to_boolean()."
          - "Normalized units are bundle, dram, gram, pinch, sprig, and vial; harvest seasons are title-case Autumn, Spring, Summer, Winter, and Year-round."
    - relation: raw.dbt_jstayton.raw_potion_ingredients
      established:
        grain: one row per potion and ingredient recipe component
        primary_key: [potion_sku, ingredient_id]
        important_findings:
          - "406 rows and 406 distinct composite keys; quantity is populated and positive."
          - "Every recipe ingredient and potion resolves; normalized recipe units match ingredient units for every current component."
    - relation: raw.dbt_jstayton.raw_brew_events
      established:
        grain: one row per brew event
        primary_key: [brew_id]
        important_findings:
          - "20000000 rows and distinct non-null brew_id values."
          - "brew_id, potion_sku, shop_id, cauldron_id, brewer_name, batch_size, quality_check, and brewed_at are populated; brewed_at::timestamp_ntz succeeds for every row."
          - "lower(trim(quality_check)) is pass or fail; 1428571 failed events are retained."
          - "brew_duration_minutes is null for 200000 events and remains nullable."
  existing_patterns:
    - path: models/staging/alembic_ops/stg_alembic_ops__shops.sql
      established: ["Uses a single Alembic source and explicit date cast in a thin staging view."]
    - path: models/marts/_marts.yml
      established: ["Contracts are configured at model level and enumerate every public column with exact data types and grounded tests."]
  data_profiles:
    - subject: "Supplier and staging-field profile"
      established: "Supplier count/key count is 15/15; all proposed required supplier fields are non-null; accepted region and rating domains are complete."
      evidence_type: warehouse aggregate query
    - subject: "Post-transformation categorical profile"
      established: "lower(trim(unit)) returns exactly bundle, dram, gram, pinch, sprig, vial on ingredients and recipes; lower(trim(quality_check)) returns pass/fail; harvest_season is preserved title-case."
      evidence_type: warehouse aggregate query
    - subject: "Recipe cost join and rollup"
      established: "406 components join to ingredients with zero unmatched rows and zero normalized-unit mismatches; rollup yields 120 potion costs totaling 307873 copper."
      evidence_type: warehouse aggregate query
    - subject: "Brew enrichment and arithmetic"
      established: "All 20000000 distinct brews match a recipe cost with no missing cost; estimated batch cost totals 7057929103363 copper; zero copper/gold arithmetic mismatches."
      evidence_type: warehouse aggregate query

decisions:
  - id: D001
    question: "Approve the proposed contracted interfaces and brew-duration null policy for the two public marts."
    evidence:
      - "The request names only the public products and required cost semantics; it does not enumerate their public columns or duration null treatment."
      - "The proposed fields preserve the source keys and event context required for procurement/production analysis, follow existing dim/fact conventions, and profile cleanly."
    options:
      - id: approve_proposed_interface
        implication: "Publish five supplier attributes and fourteen brew fields, retain nullable brew_duration_minutes, and contract/test the documented key, FK, categorical, required-field, and cost fields."
      - id: reduce_public_interface
        implication: "Remove named optional context or cost fields before implementation; downstream analysis scope narrows and the contracts/acceptance checks must be revised."
      - id: change_duration_policy
        implication: "Drop or impute missing durations; this changes the public meaning and requires an approved imputation or retention rule."
    owner: analytics/product owner
    status: approved
    approved_value: approve_proposed_interface
    rationale: "Authorized human explicitly selected 'Approve the proposed contracts' in the planning conversation on 2026-09-08."
  - id: D002
    question: "Define the estimated cost basis."
    evidence:
      - "The request explicitly requires recipe quantities and current ingredient unit costs."
      - "Current recipe units match ingredient units and all brew potions receive a standard cost."
    options:
      - id: current_recipe_cost
        implication: "Standard supply cost per potion equals sum(recipe quantity * current ingredient unit cost); batch cost equals standard cost * batch_size."
    owner: requestor
    status: approved
    approved_value: current_recipe_cost
    rationale: "Explicitly specified in the planning request."
  - id: D003
    question: "Define brew-event retention."
    evidence:
      - "The request explicitly says to preserve all brew events."
      - "The source contains 1428571 failed events and 200000 null durations."
    options:
      - id: preserve_all_brews
        implication: "Use a left join from brew events to potion cost and retain pass/fail outcomes and nullable duration values."
    owner: requestor
    status: approved
    approved_value: preserve_all_brews
    rationale: "Explicitly specified in the planning request."
  - id: D004
    question: "Set semantic scope."
    evidence: ["The request explicitly excludes Semantic Layer additions."]
    options:
      - id: defer_semantic_layer
        implication: "Create no semantic model, entity, dimension, measure, or metric in this slice."
    owner: requestor
    status: approved
    approved_value: defer_semantic_layer
    rationale: "Explicitly specified in the planning request."

