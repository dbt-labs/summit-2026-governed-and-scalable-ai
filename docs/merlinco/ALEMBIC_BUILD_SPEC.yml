version: 2

# Governed build specification for the Alembic procurement / supply-cost slice.
# Single project-owned planning artifact. Draft until every material decision is
# approved and the pre-approval coherence gate passes. Planning does not implement.
plan:
  name: Alembic procurement & production supply-cost slice
  status: approved
  owner: analytics-engineering (planning) / data-product owner (business meaning)
  approval:
    approved_by: data-product owner (via user approval in planning session)
    evidence: >
      Approved as recommended — D1-c (expose both standard_unit_supply_cost_gold
      and standard_batch_supply_cost_gold) and D2-a (relationships tests on
      fct_brews.potion_sku -> dim_potions and shop_id -> dim_shops). Pre-approval
      coherence gate passed against this design.
  pre_approval_validation:
    status: passed
    checked_at: "2024-06-13 (coherence pass against recommended design)"
    checked_by: planning-governed-source-to-mart
    checks:
      source_and_ref_columns_resolve: passed
      output_origins_match_transformations: passed
      tests_match_post_transformation_data: passed
      properties_and_contracts_match_outputs: passed
      lineage_grain_and_joins_are_coherent: passed
      formulas_and_acceptance_checks_reconcile: passed
      build_selector_covers_planned_models: passed
    findings:
      - "source_and_ref_columns_resolve: every source column referenced (raw_suppliers.supplier_id/supplier_name/region/reliability_rating/contracted_since; raw_ingredients.ingredient_id/ingredient_name/supplier_id/unit/unit_cost_copper/is_hazardous/harvest_season; raw_potion_ingredients.potion_sku/ingredient_id/quantity/unit; raw_brew_events.brew_id/potion_sku/shop_id/cauldron_id/brewed_at/batch_size/brew_duration_minutes/quality_check/brewer_name) confirmed present in raw.dbt_jstayton via warehouse profiling. Every downstream ref() input is supplied by a planned upstream output."
      - "output_origins_match_transformations: each output column carries exactly one origin. Renames/pass-throughs are source; casts, lower(trim), to_boolean, copper_to_gold, the recipe-cost sum, and unit*batch arithmetic are derived_from."
      - "tests_match_post_transformation_data: accepted_values evaluated against POST-transformation values. suppliers.region already canonical (Northern Reaches/Ember Coast/Silverwood/The Marshlands/Crystal Vale). ingredients.unit lower(trim) -> {bundle,dram,gram,pinch,sprig,vial}. quality_check lower(trim) -> {pass,fail}. All observed transformed values are covered exactly."
      - "properties_and_contracts_match_outputs: contracted mart columns enumerate every SQL output in order with matching data_type; descriptions state the same normalization/units/formula as the transformations."
      - "lineage_grain_and_joins_are_coherent: 4 staging (raw-table grain) -> 1 intermediate (recipe-line -> potion aggregation) -> 2 marts. int_potion_supply_cost is one row per potion (120), so the fct_brews left join is non-fanout; all 20,000,000 brews retained."
      - "formulas_and_acceptance_checks_reconcile: recipe unit == ingredient unit on all 406 bridge rows, so quantity*unit_cost_copper needs no conversion. Per-potion control total 356-9172 copper (3.56-91.72 gold) across all 120 potions; batch cost = unit cost * batch_size (batch_size 25-250). Every acceptance check has a deterministic expected result."
      - "build_selector_covers_planned_models: '+fct_brews +dim_suppliers' reaches all 7 planned nodes through declared lineage."
    unresolved: []
  target:
    track: wizard
    root_path: models/wizard/

request:
  business_outcome: >
    Build the governed Alembic procurement / production slice: a supplier
    dimension for procurement analysis and a brew-event fact for production
    analysis that carries an estimated standard ingredient supply cost derived
    from recipe quantities and current ingredient unit costs.
  requested_products:
    - "dim_suppliers — one row per supplier (procurement analysis)"
    - "fct_brews — one row per brew event (production analysis), with estimated standard ingredient supply cost"
  intended_consumers:
    - Procurement analytics
    - Production analytics
    - BI / AI-assisted analytics over the governed marts
  out_of_scope:
    - Actual (invoiced) procurement cost
    - Margin / cost-to-sales comparison
    - Production-to-sales cost allocation
    - Semantic Layer additions (metrics / semantic models) unless approved during planning

authority:
  project_conventions:
    - AGENTS.md (governed workflow, Warlock/Wizard boundary, human decision boundaries)
    - docs/merlinco/STYLE_GUIDE.md (layering, naming, quirks, testing, contracts)
    - dbt_project.yml (paths, materializations by layer, apothecaries database, ai_staging/ai_marts schemas)
    - .agents/ROUTING.md (planning vs implementation routing)
  source_structure:
    - models/staging/alembic_ops/_alembic_ops__sources.yml (raw_suppliers, raw_ingredients, raw_potion_ingredients, raw_brew_events declarations; PKs tested)
    - docs/merlinco/DATA_DICTIONARY.md and docs/merlinco/ERD.md (columns, grains, FKs, deliberate quirks)
  target_requirements:
    - models/wizard/README.md (canonical unsuffixed names, mirrored layer paths under models/wizard/)
  implementation_patterns:
    - models/staging/alembic_ops/stg_alembic_ops__shops.sql (staging import/renamed/select shape)
    - models/staging/abra_pos/stg_abra_pos__orders.sql, stg_abra_pos__order_items.sql (lower(trim), timestamp_ntz, copper_to_gold usage)
    - models/intermediate/int_orders_with_payments.sql (aggregation + rollup pattern)
    - models/marts/dim_shops.sql (staging -> dimension pass-through with explicit casts)
    - models/marts/fct_orders.sql and models/marts/_marts.yml (contracted fact SQL casts + enumerated typed columns)
    - macros/copper_to_gold.sql, macros/to_boolean.sql (shared cleaning macros)
  semantic_definitions:
    - models/marts/_marts.yml, metrics.yml, _semantic_models.yml (existing governed semantics; no additions in scope)

evidence:
  sources:
    - relation: raw.dbt_jstayton.raw_suppliers
      established:
        grain: one row per supplier
        primary_key: [supplier_id]
        important_findings:
          - "15 rows, supplier_id unique and not null"
          - "region has 5 distinct values, all exactly canonical (no conform_region needed)"
          - "reliability_rating 1-5, no nulls; contracted_since no nulls"
    - relation: raw.dbt_jstayton.raw_ingredients
      established:
        grain: one row per ingredient
        primary_key: [ingredient_id]
        important_findings:
          - "80 rows, ingredient_id unique and not null; 15 distinct supplier_id (full FK coverage to suppliers)"
          - "unit_cost_copper no nulls, range 4-219"
          - "unit is mixed-case; lower(trim) -> {bundle,dram,gram,pinch,sprig,vial}"
          - "is_hazardous is a messy boolean (Y/N/yes/no/TRUE/FALSE) -> to_boolean()"
    - relation: raw.dbt_jstayton.raw_potion_ingredients
      established:
        grain: one row per (potion_sku, ingredient_id) recipe line
        primary_key: [potion_sku, ingredient_id]
        important_findings:
          - "406 rows, composite key unique; all 120 potions represented"
          - "quantity 1-12, no nulls"
          - "recipe unit == ingredient unit on all 406 rows -> quantity*unit_cost_copper is unit-consistent, no conversion"
    - relation: raw.dbt_jstayton.raw_brew_events
      established:
        grain: one row per brew event (production batch)
        primary_key: [brew_id]
        important_findings:
          - "20,000,000 rows, brew_id unique and not null; 120 potions, 15 shops"
          - "batch_size 25-250, no nulls; brew_duration_minutes ~1% null (200,000 rows); brewer_name no nulls"
          - "quality_check mixed-case (FAIL/pass) -> lower(trim) {pass,fail}; ~7.1% fail"
          - "brewed_at in two formats (space-separated and ISO-Z) -> timestamp_ntz cast"
          - "0 brew potion_sku values missing a recipe -> standard cost never null"
  existing_patterns:
    - path: models/marts/dim_shops.sql
      established:
        - "Dimension reads one staging model and casts every column explicitly; no joins"
    - path: models/marts/fct_orders.sql
      established:
        - "Contracted fact casts every public column to its declared type; final CTE then select *"
    - path: models/intermediate/int_orders_with_payments.sql
      established:
        - "Intermediate owns joins + aggregation; grain change happens here, marts stay thin"
  data_profiles:
    - subject: per-potion standard ingredient cost (sum of quantity * unit_cost_copper over recipe)
      established: "All 120 potions costed; 356-9172 copper (3.56-91.72 gold); avg 2565.61 copper"
      evidence_type: warehouse control total
    - subject: fct_brews retention
      established: "Left join brews -> int_potion_supply_cost on potion_sku is non-fanout (cost is one row per potion) and 100% covered, so all 20,000,000 brew events are preserved"
      evidence_type: warehouse coverage + cardinality check

decisions:
  - id: D1
    question: >
      What grain should the estimated standard ingredient supply cost on fct_brews
      represent — the per-unit recipe standard cost, the per-batch total
      (per-unit * batch_size), or both?
    evidence:
      - "Request wording: 'estimated standard ingredient supply cost based on recipe quantities and current ingredient unit costs' describes the per-potion recipe cost but attaches it to a per-brew fact"
      - "A brew event produces batch_size units (25-250); total ingredient draw for the batch scales with batch_size"
      - "Per-unit standard cost per potion: 3.56-91.72 gold (control total)"
    options:
      - id: D1-a
        implication: "Per-unit only — cost is a recipe attribute identical across all brews of a potion; production analysts must multiply by batch_size themselves for total draw"
      - id: D1-b
        implication: "Per-batch only (per-unit * batch_size) — headline supply cost of the brew event; loses the per-unit standard unless separately derived"
      - id: D1-c
        implication: "Both columns (standard_unit_supply_cost_gold and standard_batch_supply_cost_gold) — production analysis gets the brew-event total; procurement/recipe analysis keeps the per-unit standard. Two public measures instead of one."
    owner: data-product owner (production analytics)
    status: approved
    approved_value: D1-c

    rationale: >
      RECOMMEND D1-c. Production analysis of a brew event is most naturally about
      the total ingredient supply cost consumed by that batch, while the per-unit
      standard is the reusable recipe figure. Exposing both satisfies the request
      unambiguously and defers no arithmetic to consumers. The spec below encodes
      D1-c; if D1-a or D1-b is chosen, drop the unused column and re-run the gate.
  - id: D2
    question: >
      Should fct_brews carry relationships tests on potion_sku and shop_id to the
      existing governed dim_potions and dim_shops (in the completed marts path),
      or carry those FKs as not_null-only within the isolated Wizard slice?
    evidence:
      - "dim_potions and dim_shops already exist in models/marts/ (completed, read-only starter marts); referential integrity is intact project-wide"
      - "The Wizard slice does not build its own potion or shop dimension; a relationships test would ref() completed marts (read-only, no edit)"
      - "Style guide testing standard: every FK carries relationships"
    options:
      - id: D2-a
        implication: "Add relationships tests to existing dim_potions and dim_shops — enforces the FK interface, but couples the Wizard build to the completed marts (build order dependency, cross-track ref)"
      - id: D2-b
        implication: "not_null only on potion_sku/shop_id — keeps the Wizard slice self-contained, but drops FK enforcement the style guide expects"
    owner: data-product owner / analytics-engineering
    status: approved
    approved_value: D2-a

    rationale: >
      RECOMMEND D2-a. The governed entities already exist, RI is intact, and the
      style guide requires FK relationships tests; ref() reads (not edits) the
      completed marts, which the isolation rule permits. The spec below encodes
      D2-a. If D2-b is chosen, replace the two relationships tests with not_null.

