      established:
        grain: one row per supplier
        primary_key: [supplier_id]
        important_findings:
          - 15 rows; supplier_id is unique and non-null.
          - Supplier name, region, reliability rating, and contracted date are complete and cast-compatible.
          - Regions use the five canonical shop-region spellings and ratings range from 1 through 5.
    - relation: source('alembic_ops', 'raw_ingredients')
      established:
        grain: one row per ingredient
        primary_key: [ingredient_id]
        important_findings:
          - 80 rows; ingredient_id is unique and non-null; every supplier_id resolves.
          - Unit cost is complete integer copper; normalized units are bundle, dram, gram, pinch, sprig, and vial.
          - Every hazardous flag maps through to_boolean; harvest seasons are Autumn, Spring, Summer, Winter, and Year-round.
    - relation: source('alembic_ops', 'raw_potion_ingredients')
      established:
        grain: one row per potion and ingredient recipe pair
        primary_key: [potion_sku, ingredient_id]
        important_findings:
          - 406 rows with a unique, complete composite key.
          - Every potion and ingredient FK resolves; normalized recipe unit matches the ingredient catalog unit.
          - Each potion recipe contains 2 to 5 ingredients and quantity is a complete integer from 1 through 12.
    - relation: source('alembic_ops', 'raw_brew_events')
      established:
        grain: one row per brew event or production batch
        primary_key: [brew_id]
        important_findings:
          - 20000000 active-source rows; brew_id is unique and non-null.
          - Every potion_sku and shop_id resolves; batch size is a complete integer from 25 through 250.
          - quality_check normalizes to pass or fail; brewed_at is cast-compatible and complete.
          - brew_duration_minutes ranges from 20 through 240 when present and is null on 200000 rows.
  existing_patterns:
    - path: models/staging/abra_pos/stg_abra_pos__orders.sql
      established:
        - One source import CTE, thin cleanup, lower(trim()) categoricals, explicit casts, and copper_to_gold.
    - path: models/intermediate/int_orders_with_payments.sql
      established:
        - Intermediate models own joins, grain changes, fanout control, explicit projections, and left-side retention.
    - path: models/marts/fct_orders.sql
      established:
        - Public facts consume one prepared intermediate input and cast an ordered final interface to contract types.
    - path: models/marts/_marts.yml
      established:
        - Public marts enforce contracts, test keys and relationships, and declare every public column type in SQL order.
  data_profiles:
    - subject: transformed categorical domains
      established: >
        ingredient and recipe unit = [bundle, dram, gram, pinch, sprig, vial];
        brew quality_check = [fail, pass]; supplier region = [Crystal Vale,
        Ember Coast, Northern Reaches, Silverwood, The Marshlands]; harvest season
        preserves [Autumn, Spring, Summer, Winter, Year-round].
      evidence_type: aggregate Snowflake queries over exact planned expressions
    - subject: recipe-to-cost cardinality
      established: >
        406 recipe rows join many-to-one to 80 ingredients and aggregate to 120
        unique potion rows; zero FK or unit mismatches and no brew lacks a potion cost.
      evidence_type: join and group-by Snowflake queries
    - subject: brew retention and cost control
      established: >
        The planned many-to-one left join returns 20000000 rows and 20000000
        distinct brew_id values. The current aggregate estimated batch cost is
        70579291033.63 gold with zero null costs.
      evidence_type: projected-grain and formula Snowflake queries

decisions:
  - id: D001
    question: What cost definition is approved for this slice?
    evidence:
      - The request specifies recipe quantities and current ingredient unit costs and excludes actual procurement cost.
      - Recipe and ingredient units match after normalization and all recipe ingredient FKs resolve.
    options:
      - id: standard_current_catalog_cost
        implication: >
          Calculate potion standard unit cost as sum(recipe quantity multiplied by
          current ingredient unit cost), then multiply by brew batch_size for the
          estimated batch cost. Values restate when current catalog costs change.
      - id: historical_or_actual_cost
        implication: Requires cost history or procurement transactions that are absent and explicitly out of scope.
    owner: procurement_data_product_owner
    status: approved
    approved_value: standard_current_catalog_cost
    rationale: This is the only option consistent with the explicit request and available authoritative sources.
  - id: D002
    question: How are brew events retained when cost context is joined?
    evidence:
      - The request explicitly says to preserve all brew events.
      - Current data has complete cost coverage, but left retention protects the requested grain if coverage regresses.
    options:
      - id: preserve_all_left_join
        implication: Keep every brew and surface missing recipe cost as null so tests expose incomplete cost coverage.
      - id: matched_only_inner_join
        implication: Would silently remove brews and violate the request.
    owner: production_data_product_owner
    status: approved
    approved_value: preserve_all_left_join
    rationale: Full brew-event retention is explicit.
  - id: D003
    question: Which public cost columns should fct_brews expose?
    evidence:
      - Production analysis needs both the standard cost per potion unit and the estimated cost of the recorded batch.
      - Project convention exposes reporting money in gold as number(38, 2).
    options:
      - id: unit_and_batch_gold
        implication: >
          Expose standard_unit_supply_cost_gold and estimated_batch_supply_cost_gold;
          retain copper calculations in the intermediate layer for exact reconciliation.
      - id: batch_gold_only
        implication: Smaller interface, but analysts cannot compare the standard cost per potion unit across brews.
    owner: production_data_product_owner
    status: approved
    approved_value: unit_and_batch_gold
    rationale: Approved with the complete spec as the smallest transparent interface supporting production cost analysis and formula auditability.
  - id: D004
    question: Are Semantic Layer resources part of this build?
    evidence:
      - The request explicitly excludes Semantic Layer additions unless separately approved during planning.
      - No additional semantic requirement was supplied.
    options:
      - id: defer_all_semantics
        implication: Build only the contracted marts; a later governed metric request can extend validated products.
      - id: add_semantics_now
        implication: Expands scope and requires separate metric meaning, time, entity, and aggregation approvals.
    owner: analytics_product_owner
    status: approved
    approved_value: defer_all_semantics
    rationale: The explicit exclusion governs this plan.

