version: 2

# The raw Abracadabra POS tables as dbt SOURCES. Workshop raw relations are
# pre-built in apothecaries.raw; declaring them as sources lets staging read them
# via source() and provides source metadata, source-level tests, and a `source:`
# selector. Committed seeds are portability fixtures for facilitator/environment
# setup, not a trainee workshop prerequisite.

sources:
  - name: abra_pos
    description: "Abracadabra POS — point-of-sale (potions, orders, order items, payments)."
    database: raw
    schema: dbt_jstayton
    tables:
      - name: raw_potions
        description: "Potion catalog (120 rows)."
        columns:
          - name: potion_sku
            description: Primary key — potion SKU (POT-0001).
            data_tests: [unique, not_null]
      - name: raw_orders
        description: "Orders — one row per order."
        columns:
          - name: order_id
            description: Primary key — order identifier (ORD-000001).
            data_tests: [unique, not_null]
      - name: raw_order_items
        description: "Order line items — one row per potion per order."
        columns:
          - name: order_item_id
            description: Primary key — line item identifier (ITM-000001).
            data_tests: [unique, not_null]
      - name: raw_payments
        description: "Payment attempts — splits, failures, and refunds each get a row."
        columns:
          - name: payment_id
            description: Primary key — payment identifier (PAY-000001).
            data_tests: [unique, not_null]
