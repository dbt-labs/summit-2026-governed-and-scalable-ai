version: 2

# Raw Alembic Ops tables as dbt sources over pre-built workshop relations in
# apothecaries.raw. Committed seeds are portability fixtures for facilitator or
# environment setup, not a trainee prerequisite.
#
# All five tables are declared here, including the four procurement tables
# whose staging models are the hands-on lab
# (docs/merlinco/LAB_procurement_slice.md). The lab builds staging models on top
# of these existing source declarations.


sources:
  - name: alembic_ops
    description: "Alembic Ops — production & procurement (shops, suppliers, ingredients, recipes, brews)."
    database: apothecaries
    schema: raw
    tables:
      - name: raw_shops
        description: "Shops (15 rows, 3 per region). region is the canonical spelling."
        columns:
          - name: shop_id
            description: Primary key — shop identifier (SHP-01).
            data_tests: [unique, not_null]

      # ---- procurement / supply-cost slice (lab source tables) ----
      - name: raw_suppliers
        description: "Ingredient suppliers."
        columns:
          - name: supplier_id
            description: Primary key — supplier identifier (SUP-01).
            data_tests: [unique, not_null]
      - name: raw_ingredients
        description: "Ingredients, each sourced from one supplier."
        columns:
          - name: ingredient_id
            description: Primary key — ingredient identifier (ING-001).
            data_tests: [unique, not_null]
      - name: raw_potion_ingredients
        description: "Recipe bridge — composite key (potion_sku, ingredient_id)."
        columns:
          - name: potion_sku
            description: Part of composite key; FK to raw_potions.
            data_tests: [not_null]
          - name: ingredient_id
            description: Part of composite key; FK to raw_ingredients.
            data_tests: [not_null]
      - name: raw_brew_events
        description: "Production batches — one row per brew."
        columns:
          - name: brew_id
            description: Primary key — brew identifier (BRW-00001).
            data_tests: [unique, not_null]
