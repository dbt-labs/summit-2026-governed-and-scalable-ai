version: 2

models:
  - name: stg_alembic_ops__suppliers__expected
    description: Supplier staging view at source grain with typed reliability and contract date.
    columns:
      - name: supplier_id
        description: Primary key — supplier identifier.
        data_tests: [unique, not_null]
      - name: supplier_name
        description: Supplier display name.
        data_tests: [not_null]
      - name: region
        description: Supplier region using the source's canonical region labels.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
      - name: reliability_rating
        description: Supplier reliability rating from 1 through 5.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: contracted_since
        description: Date the supplier contract began.
        data_tests: [not_null]

  - name: stg_alembic_ops__ingredients__expected
    description: Ingredient staging view at source grain with normalized units and hazardous flag and reporting currency.
    columns:
      - name: ingredient_id
        description: Primary key — ingredient identifier.
        data_tests: [unique, not_null]
      - name: ingredient_name
        description: Ingredient display name.
        data_tests: [not_null]
      - name: supplier_id
        description: FK to the ingredient's supplier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_alembic_ops__suppliers__expected')
                field: supplier_id
      - name: unit
        description: Ingredient purchasing/recipe unit, lowercased and trimmed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bundle, dram, gram, pinch, sprig, vial]
      - name: unit_cost_copper
        description: Current standard cost for one ingredient unit in copper pieces.
        data_tests: [not_null]
      - name: unit_cost_gold
        description: Current standard cost for one ingredient unit in gold crowns (copper / 100).
        data_tests: [not_null]
      - name: is_hazardous
        description: Whether the ingredient is hazardous after boolean normalization.
        data_tests: [not_null]
      - name: harvest_season
        description: Source harvest season with title case preserved.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Autumn, Spring, Summer, Winter, "Year-round"]

  - name: stg_alembic_ops__potion_ingredients__expected
    description: Recipe-component staging view at the source composite grain.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [potion_sku, ingredient_id]
    columns:
      - name: potion_sku
        description: Potion SKU component of the natural key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_abra_pos__potions')
                field: potion_sku
      - name: ingredient_id
        description: Ingredient component of the natural key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_alembic_ops__ingredients__expected')
                field: ingredient_id
      - name: quantity
        description: Number of normalized ingredient units required for one potion.
        data_tests: [not_null]
      - name: unit
        description: Recipe unit, lowercased and trimmed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bundle, dram, gram, pinch, sprig, vial]

  - name: stg_alembic_ops__brew_events__expected
    description: Brew-event staging view at source batch grain; missing duration remains null.
    columns:
      - name: brew_id
        description: Primary key — brew batch identifier.
        data_tests: [unique, not_null]
      - name: potion_sku
        description: FK to the brewed potion.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_abra_pos__potions')
                field: potion_sku
      - name: shop_id
        description: FK to the shop hosting the brew.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_alembic_ops__shops')
                field: shop_id
      - name: cauldron_id
        description: Operational cauldron identifier; no dimension exists.
        data_tests: [not_null]
      - name: quality_check
        description: Quality result, lowercased and trimmed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pass, fail]
      - name: brewer_name
        description: Recorded brewer name.
        data_tests: [not_null]
      - name: batch_size
        description: Number of potion units in the brew batch.
        data_tests: [not_null]
      - name: brew_duration_minutes
        description: Recorded brew duration in minutes; null means unknown and is preserved.
      - name: brewed_at
        description: Brew timestamp cast to timestamp_ntz.
        data_tests: [not_null]
