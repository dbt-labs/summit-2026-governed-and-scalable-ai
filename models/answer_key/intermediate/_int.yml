version: 2

models:
  - name: int_potion_supply_cost__expected
    description: Potion-grain rollup of estimated standard recipe supply cost at current ingredient unit costs.
    columns:
      - name: potion_sku
        description: Primary key — potion SKU.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_abra_pos__potions')
                field: potion_sku
      - name: ingredient_count
        description: Number of ingredient components in the standard recipe.
        data_tests: [not_null]
      - name: standard_supply_cost_copper
        description: Estimated standard cost of ingredients for one potion in copper pieces.
        data_tests: [not_null]
      - name: standard_supply_cost_gold
        description: Estimated standard cost of ingredients for one potion in gold crowns.
        data_tests: [not_null]

  - name: int_brews_with_supply_cost__expected
    description: Brew-batch enrichment that preserves every event and attaches estimated standard ingredient cost.
    columns:
      - name: brew_id
        description: Primary key — brew batch identifier.
        data_tests: [unique, not_null]
      - name: standard_supply_cost_gold
        description: Estimated standard ingredient cost for one potion in gold crowns.
        data_tests: [not_null]
      - name: estimated_batch_supply_cost_gold
        description: Estimated standard ingredient cost for the full batch in gold crowns.
        data_tests: [not_null]
