version: 2

# [answer key — disabled] Promoted from the reviewed governed Wizard implementation.
# Contracts are retained for fidelity but are not enforced while this folder is disabled.
models:
  - name: dim_suppliers__expected
    description: Supplier dimension — one row per ingredient supplier.
    config:
      contract:
        enforced: true
    columns:
      - name: supplier_id
        data_type: varchar
        description: Primary key — supplier identifier.
        data_tests: [unique, not_null]
      - name: supplier_name
        data_type: varchar
        description: Supplier display name.
        data_tests: [not_null]
      - name: region
        data_type: varchar
        description: Supplier region.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
      - name: reliability_rating
        data_type: integer
        description: Supplier reliability rating from 1 through 5.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: contracted_since
        data_type: date
        description: Date the supplier contract began.
        data_tests: [not_null]

  - name: fct_brews__expected
    description: >
      Brew-batch fact — one row per production batch. Standard cost uses current
      recipe quantities and ingredient unit costs; estimated batch cost multiplies
      that per-potion standard by batch_size and is not actual procurement or margin.
    config:
      contract:
        enforced: true
    columns:
      - name: brew_id
        data_type: varchar
        description: Primary key — brew batch identifier.
        data_tests: [unique, not_null]
      - name: potion_sku
        data_type: varchar
        description: FK to dim_potions for the brewed potion.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_potions')
                field: potion_sku
      - name: shop_id
        data_type: varchar
        description: FK to dim_shops for the shop hosting the brew.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_shops')
                field: shop_id
      - name: cauldron_id
        data_type: varchar
        description: Operational cauldron identifier; no dimension exists.
        data_tests: [not_null]
      - name: quality_check
        data_type: varchar
        description: Normalized quality result; both pass and fail batches are retained.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pass, fail]
      - name: brewer_name
        data_type: varchar
        description: Recorded brewer name.
        data_tests: [not_null]
      - name: batch_size
        data_type: integer
        description: Number of potion units in the batch.
        data_tests: [not_null]
      - name: brew_duration_minutes
        data_type: integer
        description: Recorded duration in minutes; nullable when duration is unknown.
      - name: standard_supply_cost_copper
        data_type: integer
        description: Estimated standard ingredient cost for one potion in copper pieces.
        data_tests: [not_null]
      - name: standard_supply_cost_gold
        data_type: number(38, 2)
        description: Estimated standard ingredient cost for one potion in gold crowns.
        data_tests: [not_null]
      - name: estimated_batch_supply_cost_copper
        data_type: integer
        description: Estimated standard ingredient cost for the full batch in copper pieces.
        data_tests: [not_null]
      - name: estimated_batch_supply_cost_gold
        data_type: number(38, 2)
        description: Estimated standard ingredient cost for the full batch in gold crowns.
        data_tests: [not_null]
      - name: brewed_at
        data_type: timestamp_ntz
        description: Timestamp when the batch was brewed.
        data_tests: [not_null]
      - name: brewed_date
        data_type: date
        description: Calendar date derived from brewed_at.
        data_tests: [not_null]
