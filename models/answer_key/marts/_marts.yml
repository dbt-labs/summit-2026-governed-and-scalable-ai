version: 2

# [answer key — disabled] Marts for the procurement lab. Contracts are declared
# for fidelity; they are not enforced while the folder is disabled (not built).

models:
  - name: dim_suppliers
    description: "[answer key] Supplier dimension with supplied-ingredient count."
    config:
      contract:
        enforced: true
    columns:
      - name: supplier_id
        data_type: varchar
        description: Primary key — supplier identifier.
        data_tests: [unique, not_null]
      - name: supplier_name
        data_type: varchar
      - name: region
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
      - name: reliability_rating
        data_type: integer
      - name: supplied_ingredient_count
        data_type: integer
      - name: contracted_since
        data_type: date

  - name: fct_brews
    description: "[answer key] Brew-batch-grain fact with estimated batch supply cost."
    config:
      contract:
        enforced: true
    columns:
      - name: brew_id
        data_type: varchar
        description: Primary key — brew identifier.
        data_tests: [unique, not_null]
      - name: potion_sku
        data_type: varchar
        description: FK to dim_potions.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_potions')
                field: potion_sku
      - name: shop_id
        data_type: varchar
        description: FK to dim_shops.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_shops')
                field: shop_id
      - name: brew_region
        data_type: varchar
      - name: cauldron_id
        data_type: varchar
      - name: quality_check
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [pass, fail]
      - name: passed_quality_check
        data_type: boolean
      - name: brewer_name
        data_type: varchar
      - name: batch_size
        data_type: integer
      - name: brew_duration_minutes
        data_type: integer
      - name: batch_supply_cost_gold
        data_type: number(38, 2)
      - name: brewed_at
        data_type: timestamp_ntz
      - name: brewed_date
        data_type: date
