version: 2

# ---------------------------------------------------------------------------
# Semantic layer — the governance boundary for AI-assisted / self-serve
# analytics. Consumers query these defined metrics and dimensions, not raw
# SQL against the marts, so "revenue" means one thing everywhere.
# ---------------------------------------------------------------------------

semantic_models:
  - name: orders
    description: Order-grain semantic model over fct_orders.
    model: ref('fct_orders')
    defaults:
      agg_time_dimension: ordered_date
    entities:
      - name: order
        type: primary
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: shop
        type: foreign
        expr: shop_id
    dimensions:
      - name: ordered_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical
      - name: channel
        type: categorical
      - name: fulfillment_region
        type: categorical
    measures:
      - name: order_count
        description: Count of orders.
        agg: count
        expr: order_id
        agg_time_dimension: ordered_date
      - name: net_revenue
        description: Net revenue (gross minus discount) in gold crowns.
        agg: sum
        expr: net_revenue_gold
        agg_time_dimension: ordered_date
      - name: gross_revenue
        description: Gross line revenue in gold crowns.
        agg: sum
        expr: gross_revenue_gold
        agg_time_dimension: ordered_date

  - name: order_items
    description: Line-grain semantic model over fct_order_items.
    model: ref('fct_order_items')
    defaults:
      agg_time_dimension: ordered_date
    entities:
      - name: order_item
        type: primary
        expr: order_item_id
      - name: order
        type: foreign
        expr: order_id
      - name: potion
        type: foreign
        expr: potion_sku
    dimensions:
      - name: ordered_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: units_sold
        description: Total potion units sold.
        agg: sum
        expr: quantity
        agg_time_dimension: ordered_date
      - name: line_revenue
        description: Line revenue in gold crowns.
        agg: sum
        expr: line_revenue_gold
        agg_time_dimension: ordered_date
