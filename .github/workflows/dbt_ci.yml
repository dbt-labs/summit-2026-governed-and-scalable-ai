name: dbt CI

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

# Warehouse-free gate that runs on every PR: install deps, parse the project
# (catches ref/contract/YAML errors), and lint the SQL. The full `dbt build`
# against Snowflake runs separately as a dbt platform CI job once the repo is
# linked (that one needs warehouse credentials, which are not stored here).
jobs:
  parse-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt + sqlfluff
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-snowflake>=1.8,<2.0" "sqlfluff>=3.0,<4.0" sqlfluff-templater-dbt

      - name: Install dbt packages
        run: dbt deps

      # Parse only — no warehouse connection required. Uses a dummy profile so
      # dbt can resolve the Snowflake adapter without connecting.
      - name: dbt parse
        env:
          DBT_PROFILES_DIR: ci
        run: dbt parse

      - name: sqlfluff lint
        env:
          DBT_PROFILES_DIR: ci
        run: sqlfluff lint models
