# ---------------------------------------------------------------------------
# Example dbt profile for LOCAL development against Snowflake.
#
#   * Copy this to ~/.dbt/profiles.yml and fill in your own values, OR
#   * Ignore it entirely and let the dbt platform manage the connection once
#     the repo is linked (the platform does not use this file).
#
# NEVER commit real credentials. Prefer key-pair auth or externalbrowser SSO
# over a password. Values below are placeholders.
# ---------------------------------------------------------------------------
merlinco_apothecaries:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "<your_account_locator>" # e.g. ab12345.us-east-1
      user: "<your_user>"
      authenticator: externalbrowser # SSO; or use private_key_path / password
      role: "TRANSFORMER"
      warehouse: "TRANSFORMING"
      database: "apothecaries"
      schema: "alice_dev" # your personal dev schema; dbt will build into alice_dev/raw-style env-specific schemas per project config
      threads: 8
